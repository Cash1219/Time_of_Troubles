l_english:
 identity_tot_gensokyo_charter: "Gensokyo Community"
 identity_tot_gensokyo_charter_desc: "Independent governments share a market and channels of exchange. Yakumo hosts common affairs; members may cooperate, ally or fight under normal diplomatic rules. Departure is subject to community conditions."
 principle_group_tot_gensokyo_boundary: "Internal Trade"
 principle_group_tot_gensokyo_boundary_desc: "Internal trade encourages specialization and the exchange of knowledge. The community identity guarantees the common market; this principle grants all members +10% Technology Spread and +20% Infrastructure, and adds 300 invitation acceptance. The identity governs admission and departure."
 principle_tot_gensokyo_boundary_1: "Internal Trade"
 principle_tot_gensokyo_boundary_1_desc: "$principle_group_tot_gensokyo_boundary_desc$"
 principle_group_tot_gensokyo_autonomy: "Spell Card Rules"
 principle_group_tot_gensokyo_autonomy_desc: "Members conduct danmaku duels under the Spell Card Rules and use the Danmaku Warfare army model. The host can impose its army model on members. Swaying bloc members to your side costs 50% fewer maneuvers, and members join defensive plays involving other members. Members may still fight each other, and all gain +10% Training Rate."
 principle_tot_gensokyo_autonomy_1: "Spell Card Rules"
 principle_tot_gensokyo_autonomy_1_desc: "$principle_group_tot_gensokyo_autonomy_desc$"
 principle_group_tot_gensokyo_gods: "Beloved by the Gods"
 principle_group_tot_gensokyo_gods_desc: "Divine favor strengthens the Devout Interest Group. All participant countries, including the host, gain +50% Devout Interest Group Political Strength."
 principle_tot_gensokyo_gods_1: "Beloved by the Gods"
 principle_tot_gensokyo_gods_1_desc: "$principle_group_tot_gensokyo_gods_desc$"
 tot_gensokyo_exit_years_tt: "Membership has lasted at least five years"
 tot_gensokyo_exit_peace_tt: "The country is not at war"
 tot_gensokyo_exit_cohesion_tt: "Current bloc cohesion is below 20"
 tot_gensokyo_exit_leverage_tt: "Bloc leverage advantage over this country is at most 30"
 tot_gensokyo_cohesion_shortages: "Common-market goods shortages"
 GENSOKYO_BARRIER_NETWORK: "Gensokyo"
