 principle_group_tot_gensokyo_boundary: "Internal Trade"
 principle_group_tot_gensokyo_boundary_desc: "Internal trade encourages specialization and the exchange of knowledge. The community identity guarantees the common market; this principle grants all members +10% Technology Spread and adds 300 invitation acceptance. The identity governs admission and departure."
