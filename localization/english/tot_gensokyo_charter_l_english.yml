 principle_group_tot_gensokyo_autonomy: "Member Autonomy"
 principle_group_tot_gensokyo_autonomy_desc: "Independent members may fight, cooperate or remain neutral under normal diplomatic rules, without forced war participation. All participants gain +10% Infrastructure."
 principle_tot_gensokyo_autonomy_1: "Member Autonomy"
 principle_tot_gensokyo_autonomy_1_desc: "$principle_group_tot_gensokyo_autonomy_desc$"
 principle_group_tot_gensokyo_gods: "Beloved by the Gods"
 principle_group_tot_gensokyo_gods_desc: "Divine favor strengthens the Devout Interest Group. All participant countries, including the host, gain +50% Devout Interest Group Political Strength."
