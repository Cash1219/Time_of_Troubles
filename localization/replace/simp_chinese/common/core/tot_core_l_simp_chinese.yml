l_simp_chinese:
 from_tot_idol_country: "二偶国家政治生态"
 ideology_diva: "世界第一公主陛下"
 ideology_diva_desc: "这个利益集团认为要在维持公主陛下的威望，维持初音家族的统治地位。"
 ideology_enterprise_network: "企业人脉"
 ideology_enterprise_network_desc: "这个利益集团与企业有着千丝万缕的关系，受到企业影响，支持一定程度上开放经济领域。"
 ideology_second_creation: "鼓励创作"
 ideology_second_creation_desc: "这个利益集团支持二次创作，支持一定程度上开放文化领域。"
 ideology_starlight: "命运的舞台"
 ideology_starlight_desc: "这个利益集团热衷于在命运的舞台上，选拔出最闪耀的舞台少女。"
 ideology_revue: "决斗传统"
 ideology_revue_desc: "这个利益集团热衷于通过决斗的方式解决问题。"
 ideology_fans_knight: "狂热粉丝团"
 ideology_fans_knight_desc: "这个利益集团想要维持他们崇拜的偶像的绝对地位，甚至不惜武力。"
 ideology_school_idol: "学园偶像"
 ideology_school_idol_desc: "这个利益集团想要改革传统的偶像概念，在学生会的治理体系下推广新式的学园偶像文化。"
 ideology_save_school: "复校梦"
 ideology_save_school_desc: "这个利益集团与学校有着千丝万缕的关系，受到学校影响支持一定程度上开放文化领域。"
 ideology_tradition_idol: "目标是武道馆"
 ideology_tradition_idol_desc: "这个利益集团认为需要走传统的偶像道路，通过脚踏实地登上最高舞台。"
 ideology_plutocrat_idol: "偶像商业化"
 ideology_plutocrat_idol_desc: "这个利益集团认为要在公司的管理下进行偶像的商业运作，实现偶像的商业价值和无限潜力。"
 ideology_fan_economy: "粉丝经济"
 ideology_fan_economy_desc: "这个利益集团热衷于发掘粉丝们的经济潜力，依靠粉丝经济维持预算。"
 ideology_control_group: "圈子管控"
 ideology_control_group_desc: "这个利益集团认为圈子需要有序扩张，不能过度放纵。"
 ideology_band: "自由乐队"
 ideology_band_desc: "这个利益集团希望自由宽松的举行乐队活动，让每个人都有机会发光发热。"
 ideology_producer: "Staff精神"
 ideology_producer_desc: "这个利益集团认为在幕后为偶像们无私奉献是光荣的。"
 ideology_stage_noblesse: "名流舞台主义"
 ideology_stage_noblesse_desc: "这个利益集团认为舞台应由名门与传统世家主导，重视家格、礼法与传承。"
 ideology_president_supremacy: "会长至上主义"
 ideology_president_supremacy_desc: "这个利益集团认为强而有力的会长统筹，才能让学园、社团与舞台高效运转。"
ideology_idol_worship: "偶像崇拜主义"
ideology_idol_worship_desc: "这个利益集团主张把偶像塑造成共同体的精神象征与情感中心，认为通过应援、认同与纪律可以凝聚人心、维持秩序，并让舞台成为社会共同信念的寄托。"
ideology_support_offering: "应援奉纳主义"
ideology_support_offering_desc: "这个利益集团认为既然偶像与舞台承载了共同体的热情与信念，粉丝与支持者就应以持续奉纳、后援组织与公共照护来维持其运转，让热爱转化为稳定而正当的供养。"
ideology_academy_council: "学园议会主义"
ideology_academy_council_desc: "这个利益集团主张由学生议会与代表制度来管理舞台事务，强调程序与参与。"
ideology_school_idol_unity: "学园偶像主义"
ideology_school_idol_unity_desc: "这个利益集团认为学校本身就是最重要的舞台，应以偶像活动凝聚学生、提升认同，并通过教育与成长机制让学园重新焕发生机。"
ideology_club_autonomy: "社团自治主义"
ideology_club_autonomy_desc: "这个利益集团希望社团能自行决定创作与活动安排，减少上级干预。"
 ideology_unified_tempo: "团体统合主义"
 ideology_unified_tempo_desc: "这个利益集团强调团队训练、统一纪律与协同行动，认为整齐划一才能发挥最大实力。"
 ideology_discipline_first: "风纪至上主义"
 ideology_discipline_first_desc: "这个利益集团相信严格风纪与日常管理是维持舞台秩序、塑造形象的基础。"
 ideology_agency_management: "商业运营主义"
 ideology_agency_management_desc: "这个利益集团主张以成熟的经营体系统筹艺能活动，重视资源调配、宣传规划、成员管理与长期运作，认为舞台的持续发展应建立在稳定经营、专业分工与规模化组织之上。"
 ideology_elite_training: "英才育成主义"
 ideology_elite_training_desc: "这个利益集团相信精英教育与长期培养能打磨出真正耀眼的艺能人才。"
 ideology_merit_stage: "实力至上主义"
 ideology_merit_stage_desc: "这个利益集团主张以能力、成绩与专业表现决定舞台地位，而非出身或资历。"
 ideology_free_creation: "自由创作主义"
 ideology_free_creation_desc: "这个利益集团看重表达自由、开放交流与多元文化，认为创作应尽量少受束缚。"
 ideology_stage_reform: "舞台变革主义"
 ideology_stage_reform_desc: "这个利益集团希望借助舞台活动推动社会进步，让更多普通人也能获得机会与保障。"
ideology_stage_supremacy: "舞台扩张主义"
ideology_stage_supremacy_desc: "这个利益集团主张向更大的舞台、更远的疆域和更强势的秩序推进，认为演出影响力应通过扩张、动员与强硬控制不断外推。"
ideology_campus_guardian: "校园守护主义"
 ideology_campus_guardian_desc: "这个利益集团主张为了守住学校、社团与成员共同体，必须维持足够的安全、组织与保障；它更偏向以秩序、管理与持续照护来保护舞台，而不是放任其自发运转。"
ideology_local_revival: "地方振兴主义"
 ideology_local_revival_desc: "这个利益集团希望借助地方社团、特产、在地演出与本土商业网络带动地方发展，强调让文化活动、乡土产业与区域市场彼此扶持，让人气真正沉淀为地方活力。"
 ideology_world_tour: "世界巡演主义"
 ideology_world_tour_desc: "这个利益集团主张通过跨地区交流、开放流动、对外演出与更宽松的表达空间扩大舞台影响力，认为文化不应困守一地，而应主动面向更广阔的外部世界传播、竞争与连接。"
 ideology_fan_market: "粉丝经济主义"
 ideology_fan_market_desc: "这个利益集团认为只要能有效转化粉丝热情，舞台与产业就能获得持续资金与增长。"
 ideology_pilgrimage: "圣地巡礼主义"
 ideology_pilgrimage_desc: "这个利益集团认为应当把作品、舞台与地方生活编织成可被追随与到访的文化路线，通过开放流动、服务消费与在地活动，把外来人气稳定转化为地方繁荣。"
 ideology_house_style: "门风秩序主义"
 ideology_house_style_desc: "这个利益集团重视家声、校风、体面与共同体秩序，认为维持门风、规范与日常纪律，比一时的潮流与个人放纵更重要。"
 ideology_production_floor: "幕后协力主义"
 ideology_production_floor_desc: "这个利益集团相信稳定的制作流程、专业分工与劳动保障，才是舞台能长期运转的真正基础。"
 ideology_hometown_support: "逐梦主义"
 ideology_hometown_support_desc: "这个利益集团相信普通家庭出身的人也应当拥有踏上舞台、改变人生的机会，因此支持更普及的教育、更稳妥的成长保障与更宽松的表达环境，让怀抱梦想的人能够一步步走到众人面前。"
 ideology_kirakira: "闪耀主义"
 ideology_kirakira_desc: "这个角色相信舞台的意义不只是自己向前，而是点亮同伴、带动全场，让大家一起闪闪发光；因此它更重视能凝聚团队、扩大舞台感染力并托举集体气氛的制度与环境。"
ideology_kon: "轻音主义者"
ideology_kon_desc: "这个利益集团主张在顾问指导与学园支持下，以温和、日常而非军国化的方式维系社团生活；它反对过度征募、殖民扩张与强硬军事化，认为轻音活动应在陪伴、练习与安稳的共同体氛围中延续。"
 ideology_youth_pacesetter: "领航主义"
 ideology_youth_pacesetter_desc: "这个角色相信只要率先迈步、主动向前，就能为同伴指明方向，在行动中带起队伍并凝聚舞台的青春气势。"
ideology_bond_keeper: "羁绊守护者"
ideology_bond_keeper_desc: "这个角色重视人与人之间的联系、默契与陪伴，倾向以温柔引导和守护羁绊的方式维系团队。"
ideology_academy_prestige: "学园名流主义"
ideology_academy_prestige_desc: "这个角色重视学园传统、名校气质与门面形象，认为舞台与偶像活动应体现格调与传承。"
ideology_traditional_family: "传统世家主义"
ideology_traditional_family_desc: "这个角色出身于传统家系、地方世家或旧式大家庭，重视门第、家风与共同体身份边界；这更多代表其成长背景与礼法熏陶，而不必然等同于其全部个人政见。"
ideology_inquisitive: "古典文学部主义"
ideology_inquisitive_desc: "这个角色重视在学园共同体中追问真相、观察人情与保存记忆，倾向支持更好的教育与表达空间、稳定而有人情味的社团活动，以及对不当压制、冷漠管理与不公处境发出温和而坚定的呐喊。"
ideology_rock: "摇滚主义"
ideology_rock_desc: "这个角色或利益集团强调直率表达、自主发声与不向陈规低头，倾向支持更开放的公共表达空间，并认为舞台不该完全屈从于旧权威、神圣秩序或沉默服从。"
ideology_popularity_first: "人气至上主义"
ideology_popularity_first_desc: "这个角色重视舞台反馈、观众目光与外部关注，相信只要维持足够的人气与曝光，就能不断获得更大的机会。"
ideology_chuunibyou: "中二病主义者"
ideology_chuunibyou_desc: "这个角色沉迷于自我设定、神秘叙事与超常幻想，倾向把舞台、学园乃至共同体理解为命运与力量的剧场；她通常反感平庸无趣的现实秩序，支持更自由的表达空间，也更容易接受带有象征性、仪式感与自我神圣化色彩的制度与文化。"
