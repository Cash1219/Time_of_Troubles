l_simp_chinese:
 lawgroup_health_system: "卫生系统"
 lawgroup_health_system_desc: "国家以何种方式提供医疗、慈善与公共卫生保障。"
 lawgroup_rights_of_women: "政治成年标准"
 lawgroup_rights_of_women_desc: "国家以何种标准界定青年何时能够正式承担劳动、家庭与公共政治责任。"
 law_no_womens_rights: "成年优先"
 law_no_womens_rights_desc: "只有完成成年门槛者，才被广泛视作适合承担社会责任与公共权利的正式成员。"
 law_women_in_the_fields: "全面动员"
 law_women_in_the_fields_desc: "在特殊环境下，社会大幅降低政治与劳动参与门槛，几乎所有可用人力都会被迅速纳入国家机器。"
 law_women_own_property: "标准成年"
 law_women_own_property_desc: "社会以常规年龄线划分责任与权利，青年可逐步进入劳动与公共生活，但整体仍以成年人为主。"
 law_women_in_the_workplace: "提前成年"
 law_women_in_the_workplace_desc: "社会普遍鼓励青年更早自立，更早承担劳动、家庭与社会责任。"
 law_womens_suffrage: "低龄参政"
 law_womens_suffrage_desc: "青年群体被更早承认为公共生活的参与者，学生与未完全独立者也能更积极地影响社会运转。"