l_simp_chinese:
 building_tot_animal_breeding_center: "动物培育园"
 building_tot_animal_breeding_center_desc: "从育幼室里的幼猫，到鸟舍中的雏鸟和池里的金鱼，饲育员悉心照料动物，为家庭、学校与各类观赏设施提供健康、适应人类照护的伙伴。"
 pmg_tot_animal_breeding: "动物繁育"
 pmg_tot_animal_feeding_equipment: "饲养设备"
 pm_tot_animal_breeding_standard: "规范繁育"
 pm_tot_animal_breeding_standard_desc: "通过基本卫生管理和有组织的繁育，稳定供应观赏动物。合成食品代表不同动物所需的配制饲料。"
 pm_tot_animal_breeding_scientific: "科学繁育"
 pm_tot_animal_breeding_scientific_desc: "改善营养、饲养环境和繁育管理，扩大健康动物的供应。"
 pm_tot_animal_breeding_training: "训练繁育"
 pm_tot_animal_breeding_training_desc: "在科学繁育的基础上增加社会化与训练，培育适合陪伴、观赏和表演的动物。"
 pm_tot_animal_breeding_modern: "现代繁育"
 pm_tot_animal_breeding_modern_desc: "保留繁育与训练业务，以更完善的疾病控制提高成活率，支持更大规模的动物供应。"
 pm_tot_animal_feeding_manual: "人工饲养"
 pm_tot_animal_feeding_mechanized: "机械化饲养"
 pm_tot_animal_feeding_electric: "电动饲养设备"
