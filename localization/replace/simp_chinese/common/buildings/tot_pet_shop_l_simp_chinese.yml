l_simp_chinese:
 building_tot_pet_shop: "宠物店"
 building_tot_pet_shop_desc: "从鸟笼里的文鸟和鱼缸中的金鱼，到等待新伙伴的幼猫幼犬，宠物经营与照护为城市生活带来陪伴。每级建筑代表一组店铺及配套业务。"
 building_tot_pet_shop_lens_option: "扩建$building_tot_pet_shop$"
 pmg_tot_pet_services: "宠物服务"
 pmg_tot_pet_operation: "经营组织"
 pm_tot_pet_services_traditional: "传统宠物"
 pm_tot_pet_services_traditional_desc: "经营观赏鸟、金鱼等传统宠物，提供饲养指导与观赏体验。合成食品代表配制饲料，工具代表笼舍、鱼缸配件和日常照护器具。"
 pm_tot_pet_services_companion: "伴侣宠物"
 pm_tot_pet_services_companion_desc: "保留鸟鱼经营，扩展猫犬与小动物业务。科学饲养改善照护条件，让更多家庭能够享受养宠和陪伴。"
 pm_tot_pet_services_care: "宠物看护"
 pm_tot_pet_services_care_desc: "保留此前业务，增加洗护、寄养和专业照料。对动物行为与习性的了解，帮助工作人员减少照护中的紧张反应，提供更可靠的看护。"
 pm_tot_pet_services_comprehensive: "综合宠物服务"
 pm_tot_pet_services_comprehensive_desc: "把宠物经营、看护、训练和长期照料结合起来，更完善的健康管理支持完整的养宠配套服务。"
 pm_tot_pet_operation_small: "小店经营"
 pm_tot_pet_operation_small_desc: "由店内人员承担日常经营，服务投入代表基本的采购与外部协作。"
 pm_tot_pet_operation_professional: "专业分工"
 pm_tot_pet_operation_professional_desc: "通过专业分工、纸面记录和外部协作，减少本地店铺承担的经营人手。"
 pm_tot_pet_operation_centralized: "集中经营"
 pm_tot_pet_operation_centralized_desc: "使用电话联络、集中采购和统一管理，以更多外部服务替代店铺的一部分劳工。"
