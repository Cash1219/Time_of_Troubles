l_simp_chinese:
 building_botanical_garden: "园艺场"
 building_botanical_garden_plural: "园艺场"
 building_botanical_garden_desc: "以观赏植物培育、公共园林和特色果树栽培为核心的城市园艺机构，分别供应观赏植物、游客体验和水果。"

 pmg_botanical_garden_ornamental: "观赏植物培育"
 pm_botanical_garden_ornamental_basic: "露天花圃"
 pm_botanical_garden_ornamental_basic_desc: "以木材和肥料维持基础花圃，培育面向城市居民的观赏植物。"
 pm_botanical_garden_ornamental_formal: "规整园景"
 pm_botanical_garden_ornamental_formal_desc: "经过城市规划的花坛、树篱和景观道路提高了观赏植物的商品化产量。"
 pm_botanical_garden_ornamental_greenhouse: "玻璃温室"
 pm_botanical_garden_ornamental_greenhouse_desc: "钢架玻璃温室延长栽培季节，并以工具提高稀有观赏植物的成活率。"
 pm_botanical_garden_ornamental_conservatory: "现代植物馆"
 pm_botanical_garden_ornamental_conservatory_desc: "电气化植物馆全年控制光照与环境，稳定供应高档观赏植物。"

 pmg_botanical_garden_experience: "园林服务"
 pm_botanical_garden_experience_basic: "公共开放"
 pm_botanical_garden_experience_basic_desc: "以基础服务维持园区开放，让游客从散步和观景中获得情绪价值。"
 pm_botanical_garden_experience_formal: "主题园路"
 pm_botanical_garden_experience_formal_desc: "经过设计的园路和纸质导览将普通游园转化为更完整的参观体验。"
 pm_botanical_garden_experience_educational: "园艺科普"
 pm_botanical_garden_experience_educational_desc: "讲解员以刊物介绍植物分类、栽培技巧与地方园艺传统。"
 pm_botanical_garden_experience_research: "植物学研究"
 pm_botanical_garden_experience_research_desc: "学者、出版物和电气化设备支持专题研究与高质量公众活动。"

 pmg_botanical_garden_fruit: "特色果树栽培"
 pm_botanical_garden_fruit_basic: "果树苗圃"
 pm_botanical_garden_fruit_basic_desc: "以肥料培育少量特色果树，为城市市场提供新鲜水果。"
 pm_botanical_garden_fruit_landscaped: "景观果园"
 pm_botanical_garden_fruit_landscaped_desc: "将果树配置融入园林景观，在观赏性和水果产量之间取得平衡。"
 pm_botanical_garden_fruit_glasshouse: "温室果园"
 pm_botanical_garden_fruit_glasshouse_desc: "玻璃温室保护反季节果树，扩大特色水果的稳定供应。"
 pm_botanical_garden_fruit_controlled: "环境控制栽培"
 pm_botanical_garden_fruit_controlled_desc: "电力驱动的环境控制设备让园艺场能够全年培育高产特色果树。"
