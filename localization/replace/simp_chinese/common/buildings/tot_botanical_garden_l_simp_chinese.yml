l_simp_chinese:
 building_botanical_garden: "私家庭园"
 building_botanical_garden_plural: "私家庭园"
 building_botanical_garden_desc: "由私宅、庄园、花匠和苗圃组成的私人园艺网络。它供应盆栽、花坛与花道用花，也可栽种少量庭院果树；庭园活动仅服务宅邸主人与受邀宾客。"

 pmg_botanical_garden_cultivation: "庭园培育方式"
 pm_botanical_garden_nursery: "庭园苗圃"
 pm_botanical_garden_nursery_desc: "以木材和肥料培育供私宅庭园与盆栽使用的基础观赏植物。"
 pm_botanical_garden_bonsai: "盆栽培育"
 pm_botanical_garden_bonsai_desc: "以更精细的土壤管理和修剪技术培育盆栽与庭园花木。"
 pm_botanical_garden_ikebana_greenhouse: "花道花房"
 pm_botanical_garden_ikebana_greenhouse_desc: "玻璃花房稳定供应花道和室内布置所需的观赏花材。"
 pm_botanical_garden_rare_greenhouse: "珍稀温室植物"
 pm_botanical_garden_rare_greenhouse_desc: "温室控制环境以培育稀有而高价值的观赏植物。"

 pmg_botanical_garden_fruit_trees: "庭园果树"
 pm_botanical_garden_fruit_trees_none: "无果树"
 pm_botanical_garden_courtyard_fruit_trees: "庭院果树"
 pm_botanical_garden_courtyard_fruit_trees_desc: "在庭园一角栽种少量果树，收获水果并补充景观植物。"
 pm_botanical_garden_grafted_fruit_trees: "嫁接果树"
 pm_botanical_garden_grafted_fruit_trees_desc: "通过嫁接提高庭院果树的结果率，同时维持庭园景观。"
 pm_botanical_garden_greenhouse_fruit_trees: "温室果树"
 pm_botanical_garden_greenhouse_fruit_trees_desc: "以玻璃温室保护庭院果树，获得稳定但有限的水果副产。"

 pmg_botanical_garden_private_activities: "私庭活动"
 pm_botanical_garden_private_activities_none: "无活动"
 pm_botanical_garden_private_flower_viewing: "私人赏花"
 pm_botanical_garden_private_flower_viewing_desc: "宅邸主人与受邀宾客在庭园中赏花休憩。"
 pm_botanical_garden_bonsai_gathering: "盆栽雅会"
 pm_botanical_garden_bonsai_gathering_desc: "围绕珍贵盆栽举办的私宅园艺雅集。"
 pm_botanical_garden_ikebana_study: "花道研习"
 pm_botanical_garden_ikebana_study_desc: "以观赏花材、器具和资料进行的私宅花道学习。"
 pm_botanical_garden_garden_soiree: "庭园夜会"
 pm_botanical_garden_garden_soiree_desc: "由私宅邀请宾客举行的赏花、演奏与夜间雅集。"
