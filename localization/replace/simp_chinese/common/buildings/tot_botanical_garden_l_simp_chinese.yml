l_simp_chinese:
 building_botanical_garden: "私家庭园"
 building_botanical_garden_plural: "私家庭园"
 building_botanical_garden_desc: "由私宅、庄园、花匠和苗圃组成的私人园艺网络。它供应盆栽、花坛与宅邸装点用花，也可选择栽种少量庭院果树。"

 pmg_botanical_garden_cultivation: "花卉培育"
 pm_botanical_garden_nursery: "庭园苗圃"
 pm_botanical_garden_nursery_desc: "以木材和肥料培育供私宅庭园与盆栽使用的基础花卉。"
 pm_botanical_garden_bonsai: "盆栽培育"
 pm_botanical_garden_bonsai_desc: "以更精细的土壤管理和修剪技术培育盆栽与庭园花木。"
 pm_botanical_garden_glasshouse_flowers: "玻璃花房"
 pm_botanical_garden_glasshouse_flowers_desc: "玻璃花房为私宅庭园稳定供应反季花卉与盆栽花材。"
 pm_botanical_garden_rare_greenhouse: "珍稀温室植物"
 pm_botanical_garden_rare_greenhouse_desc: "温室控制环境以培育稀有而高价值的花卉。"

 pmg_botanical_garden_fruit_trees: "庭园果树"
 pm_botanical_garden_fruit_trees_none: "无果树"
 pm_botanical_garden_courtyard_fruit_trees: "庭院果树"
 pm_botanical_garden_courtyard_fruit_trees_desc: "在庭园一角栽种少量果树，收获水果，但会占用部分花圃。"
 pm_botanical_garden_grafted_fruit_trees: "嫁接果树"
 pm_botanical_garden_grafted_fruit_trees_desc: "通过嫁接提高庭院果树的结果率，但会进一步减少花圃面积。"
 pm_botanical_garden_greenhouse_fruit_trees: "温室果树"
 pm_botanical_garden_greenhouse_fruit_trees_desc: "以玻璃温室保护庭院果树，获得稳定水果，但会显著压缩花卉培育面积。"
