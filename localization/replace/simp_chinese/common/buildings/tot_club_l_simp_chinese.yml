TOT_CLUB_PANEL_SUMMARY_TOOLTIP: "这里会显示社团建筑提供的体验、承载力与当前维护占用。"
TOT_CLUB_PANEL_DESC: "社团是固定的公共组织设施：满员后产出体验并提供承载力，用于维持受任角色职位。"
