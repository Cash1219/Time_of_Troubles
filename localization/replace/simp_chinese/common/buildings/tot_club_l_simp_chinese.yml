l_simp_chinese:
 building_club: "社团"
 building_club_lens_option: "扩建$building_club$"

 pmg_club_activity: "活动重心"
 pmg_club_operation: "运营方式"
 pm_club_activity_community: "日常活动"
 pm_club_activity_community_desc: "成员围绕稳定的日常活动组织社团，兼顾体验产出与承载力供给。"
 pm_club_activity_exchange: "对外交流"
 pm_club_activity_exchange_desc: "通过校际访问、公开活动与交流材料扩大社团影响，侧重产出体验。"
 pm_club_activity_network: "组织网络"
 pm_club_activity_network_desc: "将社团纳入稳定的联络与协作网络，侧重为国家提供社团承载力。"
 pm_club_operation_member_run: "成员自治运营"
 pm_club_operation_member_run_desc: "由成员自行维持日常活动，不增加额外的组织投入。"
 pm_club_operation_advised: "顾问配属运营"
 pm_club_operation_advised_desc: "为社团配备文书与顾问，以额外纸张和职员换取少量体验增产与更高吞吐。"
 pm_club_operation_certified: "认证项目运营"
 pm_club_operation_certified_desc: "按认证项目组织活动，以更多文书、服务和职员投入换取显著的体验产出，不额外提供承载力。"
 pm_club_operation_integrated: "统合运营"
 pm_club_operation_integrated_desc: "将社团接入校方的统一活动体系，以较多文书、服务与职员换取吞吐与额外承载力。"
 pm_club_literature: "文学部"
 pm_club_literature_desc: "以阅读、写作、研究与资料整理为主要活动内容的文化类社团。"
 pm_club_athletics: "田径部"
 pm_club_athletics_desc: "以体能训练、竞赛活动与纪律协作为主要内容的运动类社团。"
 pm_club_music: "轻音部"
 pm_club_music_desc: "以乐器演奏、合奏练习和小型演出为主要活动内容的音乐类社团。"
 pm_club_drama: "演剧部"
 pm_club_drama_desc: "以剧本排演、舞台表演与集体协作为主要内容的戏剧类社团。"
 pm_club_art: "美术部"
 pm_club_art_desc: "以绘画、设计、装饰制作与审美训练为主要内容的艺术类社团。"

 pm_club_support_illegal: "无合法社团"
 pm_club_support_illegal_desc: "社团缺乏正式身份，只能在有限保障下活动。仍可提供基础体验与少量承载力，但整体效率较低。"
 pm_club_support_autonomy: "社团自治"
 pm_club_support_autonomy_desc: "社团主要依靠成员自发组织和自我维持，以常规服务投入换取稳定的体验产出与承载力。"
 pm_club_support_advisor: "顾问指导"
 pm_club_support_advisor_desc: "学校为社团配备顾问与基础文书支持，以额外纸张和职员投入提升社团的承载力与吞吐。"
 pm_club_support_strict: "严格准入"
 pm_club_support_strict_desc: "通过审核的社团获得规范运作条件，承载力保持常规水平，但体验产出与投入效率更高。"
 pm_club_support_coordination: "学园统筹"
 pm_club_support_coordination_desc: "社团被纳入统一协调与资源配置体系，以较多文书和职员投入换取最高的承载力供给。"

 institution_club_management: "社团管理"
 institution_club_management_desc: "通过行政体系协调社团资格、资源分配与活动秩序的学园管理机构。"

 lawgroup_club_management: "社团管理"
 lawgroup_club_management_desc: "国家与学校以何种方式承认、约束并统筹社团活动。"
law_no_club_management: "无合法社团"
law_no_club_management_desc: "国家与学校不承认正式社团体系。社团只能依靠成员自行维持，全部社团吞吐量降低。"
law_club_autonomy: "社团自治"
law_club_autonomy_desc: "社团自主决定活动、招募与日常运作。社团管理机构成本较低，但不提供额外的顾问或统合运营权限。"
law_club_advisor_guidance: "顾问指导"
law_club_advisor_guidance_desc: "学校允许社团自由发展，同时安排顾问与文书支持。社团吞吐量略有提高，并可启用顾问配属运营。"
 law_club_strict_admission: "认证社团制"
law_club_strict_admission_desc: "社团以认证项目为核心取得正式资格。认证项目能显著提高体验产出，但需要较多文书与服务投入。"
law_club_school_coordination: "学园统筹"
law_club_school_coordination_desc: "社团活动被纳入学园统一协调与资源配置。管理成本较高，但可启用顾问配属与统合运营，后者可额外提供承载力。"

country_tot_club_capacity_add: "社团承载力"
country_tot_club_capacity_add_desc: "国家可稳定维持角色职位与组织活动的容量。基础值、创新力与正常运作的社团都会提供承载力。"
country_tot_club_capacity_usage_add: "社团承载力占用"
country_tot_club_capacity_usage_add_desc: "当前受任核心幕僚与名誉职务对社团承载力的维护占用。"
building_club_throughput_add: "社团吞吐量"
building_club_throughput_add_desc: "提高社团建筑的投入与产出效率。"
country_institution_club_management_max_investment_add: "社团管理机构最大等级"
country_institution_club_management_max_investment_add_desc: "提高社团管理机构可投入的最大等级。"
 
