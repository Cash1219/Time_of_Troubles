l_simp_chinese:
#游乐场
 building_amusement_park: "游乐场"
 building_amusement_park_desc: "以动力驱动的游乐设施为核心，结合主题布景、园区商店与角色商品，为城市居民提供游玩、约会和休闲消费体验。"
 building_amusement_park_lens_option: "扩建$building_amusement_park$"

 pmg_amusement_ground: "园区场地"
 pm_amusement_ground_fair: "露天游乐场"
 pm_amusement_ground_fair_desc: "以草坪、帐篷、木制设施和露天表演为核心的早期西式游乐场，为城市居民提供简单而热闹的休闲体验。"
 pm_amusement_ground_garden: "景观游乐园"
 pm_amusement_ground_garden_desc: "经过规划的园林式游乐园，以花园、步道、玻璃温室和精心布置的景观营造完整的游园体验。"
 pm_amusement_ground_electric: "电气主题乐园"
 pm_amusement_ground_electric_desc: "电力照明、钢结构和夜间演出让游乐园突破白天限制，园区开始拥有鲜明的主题和现代都市气息。"
 pm_amusement_ground_dream: "综合主题乐园"
 pm_amusement_ground_dream_desc: "由主题区域、标志性建筑和大型设施组成的综合乐园，将故事、景观与机械娱乐包装成连贯的梦幻体验。"

 pmg_amusement_ride: "游乐设备"
 pm_amusement_ride_carousel: "旋转木马"
 pm_amusement_ride_carousel_desc: "动力驱动的旋转木马配合棚亭、步道与基础布景，构成机械游乐场最初的园区配置。"
 pm_amusement_ride_coaster: "现代过山车"
 pm_amusement_ride_coaster_desc: "先进的钢制轨道与结构制造让过山车成为园区的新招牌，同时保留旋转木马、摩天轮与碰碰车，形成完整的主题游乐体验。"
 pm_amusement_ride_neon: "碰碰车"
 pm_amusement_ride_neon_desc: "电动碰碰车以驾驶、追逐和碰撞带来互动乐趣，橡胶轮胎与缓冲部件保障运行；园区同时保留此前的观览与乘坐项目。"
 pm_amusement_ride_ferris: "摩天轮"
 pm_amusement_ride_ferris_desc: "钢结构与动力设备支持大型摩天轮，园区在基础游乐项目之外增加高空观览，在最高点俯瞰城市成为约会的经典时刻。"

 pmg_amusement_shop: "园区商店"
 pm_amusement_shop_stall: "园区周边摊位"
 pm_amusement_shop_stall_desc: "分布在园区各处的周边摊位，出售玩偶、徽章和其他小型纪念品；游客购买商品后，将消费转化为游乐场的体验收入。"
 pm_amusement_shop_souvenir: "纪念品商店"
 pm_amusement_shop_souvenir_desc: "更完整的园区周边商店，保留基础周边销售，并以更稳定的商品供应提升游客消费。"
 pm_amusement_shop_limited: "主题商品店"
 pm_amusement_shop_limited_desc: "围绕不同园区和故事主题经营的专门商店，在基础周边之外增加娱乐出版物等主题内容。"
 pm_amusement_shop_collab: "角色联名商店"
 pm_amusement_shop_collab_desc: "围绕虚构角色、流行故事和游戏推出联名商品，使游乐园从休闲场所发展为完整的娱乐品牌。"

#水族馆
 building_aquarium: "水族馆"
 building_aquarium_desc: "面向公众开放的玻璃水箱展馆，以展览为核心，展示海洋与淡水生物，兼顾科普、观光与休闲。"
 building_aquarium_lens_option: "扩建$building_aquarium$"

 pmg_aquarium_ground: "展馆场地"
 pm_aquarium_ground_tank: "玻璃水箱展馆"
 pm_aquarium_ground_tank_desc: "1853年伦敦动物园开放了世界上第一座公共水族馆，玻璃水箱中的水下世界从此向大众敞开。"
 pm_aquarium_ground_marine: "海洋生物馆"
 pm_aquarium_ground_marine_desc: "玻璃工艺的进步让大型海水水箱成为可能，海洋生物的分类与饲养也走向科学化。"
 pm_aquarium_ground_tunnel: "海底隧道"
 pm_aquarium_ground_tunnel_desc: "钢架与玻璃构成的深海隧道让人行走在鱼群之间，成为水族馆约会的经典名场面。"
 pm_aquarium_ground_mega: "巨型综合馆"
 pm_aquarium_ground_mega_desc: "大型综合水族馆以主题展区与吉祥物吸引游客，企鹅、水母与海豚各有自己的应援团。"

 pmg_aquarium_animal_type: "水生动物展览"
 pm_aquarium_type_freshwater: "淡水生物"
 pm_aquarium_type_freshwater_desc: "购入淡水观赏动物，以玻璃水箱、饲料和讲解服务维持基础展区。动物供应统一由展览线承担。"
 pm_aquarium_type_marine: "海洋生物"
 pm_aquarium_type_marine_desc: "保留淡水展区，增设海水动物展示，以更多观赏动物、饲料和玻璃设施扩大参观规模。"
 pm_aquarium_type_reef: "大型海洋生物"
 pm_aquarium_type_reef_desc: "增设鲨、鳐及海洋哺乳动物等大型动物展区，以更大水池、饲料和电力支持综合展示。"
 pm_aquarium_type_mammal: "仿海洋造景"
 pm_aquarium_type_mammal_desc: "保留此前动物展区，通过地形、光照、水流和专题讲解营造完整的仿海洋环境，扩大展示与接待规模。"

 pmg_aquarium_interaction: "动物互动"
 pm_aquarium_program_feeding: "饲养员投喂"
 pm_aquarium_program_feeding_desc: "饲养员在游客面前照料并展示水生动物，让日常喂养成为最基础的动物互动节目。"
 pm_aquarium_program_concert: "游客投喂"
 pm_aquarium_program_concert_desc: "在饲养员公开投喂之外，游客可以在工作人员指导下向适合互动的水生动物投喂饲料，参与水族馆组织的动物活动。"
 pm_aquarium_program_show: "海洋动物表演"
 pm_aquarium_program_show_desc: "在饲养员投喂与游客投喂之外，增加海狮、海豚等动物的训练节目，以额外饲料、服务和电力组织定时演出；动物由展览线统一供应。"
 pm_aquarium_program_theater: "海洋动物剧场"
 pm_aquarium_program_theater_desc: "专门的动物剧场将灯光、讲解与海洋动物表演结合，成为水族馆最具吸引力的互动项目。"

 pmg_aquarium_circulation: "水循环设备"
 pm_aquarium_circulation_manual: "人工养护"
 pm_aquarium_circulation_manual_desc: "以基础工具和人工进行换水、清洁、饲料搬运与展示设施养护。"
 pm_aquarium_circulation_mechanized: "动力循环"
 pm_aquarium_circulation_mechanized_desc: "使用动力水泵和搬运设备替代部分换水、搬运与清洁劳工，增加工具和引擎开销。"
 pm_aquarium_circulation_electric: "电动循环"
 pm_aquarium_circulation_electric_desc: "进一步采用电动循环、搬运和清洁设备，以工具、引擎及电力投入减少劳工。"

 pmg_aquarium_education: "科普教育"
 pm_aquarium_program_guide: "科普导览"
 pm_aquarium_program_guide_desc: "讲解员带领游客认识展品背后的故事，把基础科普导览变成水族馆的固定项目。"
 pm_aquarium_program_night: "夜间科普展"
 pm_aquarium_program_night_desc: "夜间开放的专题展览利用安静的环境讲解水生生态，让参观从观赏延伸到学习。"
 pm_aquarium_program_research: "水生生态教育"
 pm_aquarium_program_research_desc: "水族馆与学校、研究者合作，展示水生生态、保护行动和基础研究成果。"
 pm_aquarium_program_documentary: "海洋纪录放映"
 pm_aquarium_program_documentary_desc: "以普通出版物、娱乐出版物和讲解服务制作海洋纪录展，将远方海域与水下生态带给城市观众。"

#动物园
 building_zoo: "动物园"
 building_zoo_desc: "饲养并展示多种动物的公共设施，以动物类型与互动表演为核心，是城市重要的休闲场所。"
 building_zoo_lens_option: "扩建$building_zoo$"

 pmg_zoo_ground: "园区场地"
 pm_zoo_ground_pen: "小型围场"
 pm_zoo_ground_pen_desc: "1828年伦敦动物园成立，现代动物园由此诞生；简单的围栏与笼舍是它的起点。"
 pm_zoo_ground_park: "围场园区"
 pm_zoo_ground_park_desc: "规整的围场与步道让游客可以按路线参观，动物的生活空间也更舒适。"
 pm_zoo_ground_stadium: "大型剧场"
 pm_zoo_ground_stadium_desc: "大型动物剧场与猛兽表演场馆，让动物园的表演走向规模化与专业化。"
 pm_zoo_ground_eco: "生态园区"
 pm_zoo_ground_eco_desc: "开放式生态园区模拟动物栖息地，让动物在更自然的环境中生活与展示。"

 pmg_zoo_animal_type: "动物展览"
 pm_zoo_type_small: "小型动物"
 pm_zoo_type_small_desc: "从动物培育园购入小型观赏动物，配置饲料与讲解人员，以基础展区、日常导览和图文说明接待游客。"
 pm_zoo_type_predator: "猛兽"
 pm_zoo_type_predator_desc: "在小型动物展区之外增设狮、虎与熊等猛兽展区，扩大动物供应、饲养和接待规模。"
 pm_zoo_type_large: "大型动物"
 pm_zoo_type_large_desc: "增设象、犀牛与长颈鹿等大型动物展区，以更多观赏动物、合成饲料和服务支持更大规模的综合参观。"
 pm_zoo_type_star: "明星动物"
 pm_zoo_type_star_desc: "保留此前展区，以熊猫、企鹅等招牌动物及专题讲解吸引游客，让动物园成为全城熟知的观赏场所。"

 pmg_zoo_interaction: "动物互动"
 pm_zoo_interaction_basic: "饲养员投喂"
 pm_zoo_interaction_basic_desc: "饲养员定时公开喂食并讲解动物习性，将展区动物的日常活动组织成供游客观看的动物节目。"
 pm_zoo_interaction_feeding: "游客投喂"
 pm_zoo_interaction_feeding_desc: "在公开喂食节目之外，游客也可在工作人员指导下喂食温顺动物，以额外饲料和接待服务扩大参与式动物活动。"
 pm_zoo_interaction_show: "驯兽表演"
 pm_zoo_interaction_show_desc: "额外购入专业演出动物，将喂食互动与训练动作编排成定时节目，扩大演出规模并配置照明和接待。"
 pm_zoo_interaction_grand: "动物马戏团"
 pm_zoo_interaction_grand_desc: "增加演出动物供应，将此前动物活动与马戏节目、舞台调度和灯光结合，形成规模化的招牌演出。"

 pmg_zoo_feeding_equipment: "饲养设备"
 pm_zoo_feeding_manual: "人工饲养"
 pm_zoo_feeding_manual_desc: "使用基础工具维护笼舍与围栏，依靠人工完成饲料搬运、喂养和清洁。"
 pm_zoo_feeding_mechanized: "机械化饲养"
 pm_zoo_feeding_mechanized_desc: "使用动力设备搬运和输送饲料、辅助清洁，以工具和引擎投入替代部分劳工。"
 pm_zoo_feeding_electric: "电动饲养设备"
 pm_zoo_feeding_electric_desc: "用电动搬运、输送和清洁设备进一步减少劳工，同时承担设备维护与电力开销。"

 pmg_zoo_education: "科普教育"
 pm_zoo_education_guide: "动物导览"
 pm_zoo_education_guide_desc: "讲解员带领游客认识动物、栖息地和饲养方式，把参观路线变成基础自然教育课程。"
 pm_zoo_education_natural_history: "自然史教育"
 pm_zoo_education_natural_history_desc: "通过标本、图文和出版物讲解动物演化与自然史，让动物园兼具博物馆功能。"
 pm_zoo_education_conservation: "动物保育研究"
 pm_zoo_education_conservation_desc: "动物园与研究机构合作展示保育计划、繁育记录和野生动物保护成果。"
 pm_zoo_education_documentary: "动物纪录展"
 pm_zoo_education_documentary_desc: "利用纪录影像和专题展览呈现动物的自然生活，把园内展示延伸到更广阔的生态环境。"
