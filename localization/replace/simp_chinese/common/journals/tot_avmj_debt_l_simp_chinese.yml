l_simp_chinese:
 je_tot_avmj_debt_crisis: "Ave Mujica债务大会"
 je_tot_avmj_debt_crisis_complete_tt: "Ave Mujica的债务本金已经偿清。最终结算已记入债务大会。"
 je_tot_avmj_debt_crisis_desc: "这笔1,680,000的本金属于丰川家。利息按月累积，详细账本和还款档位请在角色→活动→债务大会查看。"
 je_tot_avmj_debt_crisis_reason: "这是丰川家以财政收入履行的债券安排。现有建筑所有权已经体现债权人的经济影响，角色活动页记录债务账本、大会付款和最终政治结局。"
 je_tot_avmj_debt_crisis_status: "债务大会详情请在角色→活动→债务大会查看。"
 je_tot_avmj_debt_crisis_status_chamber: "债务大会详情请在角色→活动→债务大会查看。"
 tot_avmj_debt.20.t: "领袖之争：雇佣兵续约"
 tot_avmj_debt.20.d: "若叶睦与她的雇佣兵团在南意大利的三年合约已经届满。续约需要支付50,000佣金；作为 AVMJ 宗主的 GBDP 与 HTT 愿意以减记部分丰川债务、获得更多特权为代价，支持这项安排。若不续约，若叶睦将带领雇佣兵团回到 AVMJ。"
 tot_avmj_debt.20.renew: "续约，留下这支雇佣兵团"
 tot_avmj_debt.20.return: "不再续约，遣返若叶睦"
 tot_avmj_debt_burden: "Ave Mujica债务负担"
 tot_avmj_debt_burden_desc: "丰川家的历史债务正在压缩AVMJ的财政、权威与国际声望。"
 tot_avmj_interest_arrears: "债务大会利息拖欠"
 tot_avmj_interest_arrears_desc: "股东大会未能支付全部应付利息，未付款项将继续累积。"
 tot_avmj_aleppo_chamber: "阿勒颇商会债权"
 tot_avmj_aleppo_chamber_desc: "MYGO灭亡后，阿勒颇本地商会接管了MYGO在AVMJ债务中的剩余债权。"
 tot_avmj_debt_low_repayment: "低额债务缴款"
 tot_avmj_debt_low_repayment_desc: "低额缴款使债权人怀疑AVMJ的偿债意愿。"
 tot_avmj_debt_high_repayment: "积极债务缴款"
 tot_avmj_debt_high_repayment_desc: "较高的日常缴款改善了政府的合法性与影响力。"
 tot_avmj_debt_maximum_repayment: "最大化债务缴款"
 tot_avmj_debt_maximum_repayment_desc: "AVMJ正在以最大的财政努力维护债务信誉。"
 tot_avmj_creditor_concession: "债权人让步"
 tot_avmj_creditor_concession_desc: "债务大会短缺后，AVMJ向债权人开放了更多政治空间。"
 tot_avmj_creditor_default: "债务违约压力"
 tot_avmj_creditor_default_desc: "债权人将资金池短缺视为违约，AVMJ的政治处境恶化。"
