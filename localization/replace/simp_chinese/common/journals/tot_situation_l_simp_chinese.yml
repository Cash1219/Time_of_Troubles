l_simp_chinese:
 je_idol_unmei_ituations: "偶像的命运"
 je_idol_unmei_ituations_desc: "偶像的战斗，不是杀就是被杀"
 je_group_tot_idol_succession: "偶像帝国继承危机"
 je_tot_idol_succession_crisis: "偶像帝国继承危机"
 je_tot_idol_succession_crisis_desc: "偶像帝国解体后的继承争端仍在发酵。拉拉与偶像大师围绕正统、领土与奥地利主导权持续博弈，邦多利与外部势力则伺机介入。若紧张度失控，局势将直接升级为战争；若倒计时结束前始终无人取得明显优势，则各方更可能被迫妥协。"
 je_tot_idol_succession_crisis_reason: "拉拉与偶像大师正围绕旧偶像帝国的法统、领土与奥地利主导权展开长期博弈。邦多利与外部势力也在持续下注，试图把危机导向最有利于自己的结局。当前版本先用分数、紧张度与倒计时展示局势骨架，后续再逐步补入外交事件、妥协方案与战争升级路线。"
 je_tot_idol_succession_crisis_status: "#bold 当前局势#!\n拉拉阵营分数：#variable [ROOT.GetCountry.MakeScope.Var('tot_idol_crisis_ll_score').GetValue|0]#!\n偶像大师分数：#variable [ROOT.GetCountry.MakeScope.Var('tot_idol_crisis_imas_score').GetValue|0]#!\n邦多利分数：#variable [ROOT.GetCountry.MakeScope.Var('tot_idol_crisis_gbdp_score').GetValue|0]#!\n魔法少女联邦分数：#variable [ROOT.GetCountry.MakeScope.Var('tot_idol_crisis_ger_score').GetValue|0]#!\n轻音分数：#variable [ROOT.GetCountry.MakeScope.Var('tot_idol_crisis_htt_score').GetValue|0]#!\n\n紧张度：#variable [ROOT.GetCountry.MakeScope.Var('tot_idol_crisis_tension').GetValue|0]#!/100\n妥协度：#variable [ROOT.GetCountry.MakeScope.Var('tot_idol_crisis_compromise_score').GetValue|0]#!/100\n\n倒计时结束时，若拉拉与偶像大师仍未拉开明显分差，则优先导向妥协或维持现状结局。"
 je_tot_idol_succession_crisis_complete_tt: "局势日志会在倒计时结束时自动结算；若紧张度先达到上限，则会提前升级为战争。"
 je_tot_idol_crisis_tension_bar_name: "紧张度"
 je_tot_idol_crisis_tension_bar_desc: "进度：#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!（[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/100）"
 je_tot_idol_crisis_compromise_bar_name: "妥协度"
 je_tot_idol_crisis_compromise_bar_desc: "进度：#v [JournalEntry.GetCurrentBarProgress(ScriptedProgressBar.Self)|%]#!（[JournalEntry.GetCurrentBarValue(ScriptedProgressBar.Self)|1]/100）"
 je_tot_ll_publication_program: "拉拉阵营内部整合"
 je_tot_ll_publication_program_desc: "若拉拉想以真正的帝国继承者自居，就必须先把自己的附庸、生活水平与产业方向统合起来。只有先把舞台传播与巡礼交通做成体系，拉拉对旧帝国的正统宣称才站得住脚。"
 je_tot_ll_publication_program_reason: "在对外争夺法统之前，拉拉必须先把自己的核心版图与附属地带组织成一个稳定整体。控制 Aqours 与虹咲对应区域，再补足生活水平、经济规模与关键产业，才算真正完成阵营内部整合。"
 je_tot_ll_publication_program_status: "先把 Aqours 与虹咲对应区域纳入我方直辖或附庸控制，再把本阵营的生活水平、经济规模与两项核心产业补齐。下方完成条件会实时勾选；产业项目则需要通过按钮手动确认。"
 je_tot_imas_publication_program: "偶像大师阵营内部整合"
 je_tot_imas_publication_program_desc: "偶像大师阵营若想压过拉拉，就必须先把本家的运营体系、附属学园与关键工业节点整合成整体。只有能把维也纳的事务所网络与波希米亚的育成体系稳定下来，才有资格去争夺新帝国的法统。"
 je_tot_imas_publication_program_reason: "偶像大师阵营要证明自己更适合主导新帝国，就不能只靠本家的名义，还得把初星对应地带、经济体量与事务所育成体系一并整合起来。完成这些目标后，本阵营的制度正统性才会明显提升。"
 je_tot_imas_publication_program_status: "先把初星对应区域纳入我方直辖或附庸控制，再把本家的生活水平、经济规模与两项关键产业做成制度化成果。下方完成条件会实时勾选；产业项目则需要通过按钮手动确认。"
 je_tot_ll_aqo_territory_ready_tt: "Aqours对应区域已由我国或附庸控制"
 je_tot_ll_njs_territory_ready_tt: "虹咲对应区域已由我国或附庸控制"
 je_tot_ll_sol_ready_tt: "平均生活水平达到 #v 15#!"
 je_tot_ll_gdp_ready_tt: "GDP达到 #v 500万#!"
 je_tot_ll_industry_stage_ready_tt: "已完成布达佩斯舞台传播网"
 je_tot_ll_industry_transit_ready_tt: "已完成达尔马提亚巡礼交通"
 je_tot_imas_gkms_territory_ready_tt: "初星对应区域已由我国或附庸控制"
 je_tot_imas_sol_ready_tt: "平均生活水平达到 #v 15#!"
 je_tot_imas_gdp_ready_tt: "GDP达到 #v 500万#!"
 je_tot_imas_industry_agency_ready_tt: "已完成维也纳事务所网络"
 je_tot_imas_industry_training_ready_tt: "已完成波希米亚育成体系"
 je_tot_ll_stage_network_button: "完成布达佩斯舞台传播网"
 je_tot_ll_stage_network_button_desc: "在中央匈牙利建立更成熟的舞台传播体系。要求该地在我国或附庸手中，且拥有至少2级舞台与3级大学。"
 je_tot_ll_pilgrimage_transit_button: "完成达尔马提亚巡礼交通"
 je_tot_ll_pilgrimage_transit_button_desc: "打通达尔马提亚的圣地巡礼与海滨接待能力。要求该地在我国或附庸手中，且拥有至少2级港口与2级舞台。"
 je_tot_imas_agency_network_button: "完成维也纳事务所网络"
 je_tot_imas_agency_network_button_desc: "将维也纳建设成更成熟的事务所与偶像运营中心。要求该地在我国或附庸手中，且拥有至少2级舞台、2级纸厂与1级贸易中心。"
 je_tot_imas_training_system_button: "完成波希米亚育成体系"
 je_tot_imas_training_system_button_desc: "在波希米亚建立能支撑偶像培养的工业与教育基础。要求该地在我国或附庸手中，且拥有至少3级大学与3级工具厂。"
 tot_idol_succession.1.t: "偶像帝国继承危机失控"
 tot_idol_succession.1.d: "各方在继承问题上的博弈已彻底失控。拉拉与偶像大师阵营之间的互信完全破裂，围绕奥地利与旧帝国法理的争端，已经无法继续靠外交维持。现在，局势将直接升级为正面战争。"
 tot_idol_succession.1.a: "战争爆发"
 tot_idol_succession.2.t: "偶像帝国继承危机结算"
 tot_idol_succession.2.d: "局势日志的倒计时已经结束。各方在过去数年中的施压、让步与干涉，将在此刻转化为最终结论。若拉拉与偶像大师之间仍未拉开明显差距，则更可能进入妥协与维持现状；若优势已经形成，则局势将走向一方主导的解决方案。"
 tot_idol_succession.2.a: "局势暂时以妥协收场"
 tot_idol_succession.2.b: "分差已现，妥协窗口正在关闭"
 tot_idol_succession_compromise_tt: "由于拉拉与偶像大师阵营的分差不足，局势将优先导向妥协或维持现状结局。"
 tot_idol_succession_no_compromise_tt: "由于拉拉与偶像大师阵营已经形成明显分差，局势不再优先触发妥协结局。"
