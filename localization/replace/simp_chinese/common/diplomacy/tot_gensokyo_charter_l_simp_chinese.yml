 tot_gensokyo_exit_peace_tt: "当前没有参与战争"
 tot_gensokyo_exit_cohesion_tt: "共同体当前凝聚力低于20"
 tot_gensokyo_exit_leverage_tt: "共同体对本国的优势不高于30"
