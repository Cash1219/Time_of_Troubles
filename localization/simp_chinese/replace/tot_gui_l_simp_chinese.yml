 building_band_headquarter: "乐队总部"
 building_band_headquarter_desc: "用于管理单支乐队成员、投入与创作事务的文化机构。它作为普通文娱建筑存在，会维持基础雇员以保证日常运转。每个地区最多只能拥有一个乐队总部，并且需要国家仍有空余乐队总部上限时才能建造。"
 building_stage: "舞台"
 building_stage_desc: "由政府主导运营的公共演出场所。舞台负责持续投入资源并产出演出商品，为国家提供稳定的文化消费与轻度商业回收。"
