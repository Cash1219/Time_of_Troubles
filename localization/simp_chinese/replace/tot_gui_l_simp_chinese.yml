 concept_tot_province_governor: "总督"
 concept_tot_province_governor_desc: "总督是由国家在具体省份任命的地方行政角色。每个省份同时只能拥有一名总督；被任命的角色会获得“总督”身份，并为该省份提供基础建造力修正。国家统治者、继承人和利益集团领袖原则上不能担任总督。卸任或替换总督会移除该身份，替换需要等待十年冷却。总督数量受总督上限限制：国家会按照位阶获得基础上限，任命官僚制额外提供总督上限。"
