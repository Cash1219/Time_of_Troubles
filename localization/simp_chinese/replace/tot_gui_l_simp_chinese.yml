 kizuna.229.a: "立刻接下，全力准备首秀\n#P 效果：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 创作进度 #P +45#!；等级经验 #P +140#!。"
 kizuna.229.b: "先调整节目单，再稳稳上台\n#P 效果：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 创作进度 #P +20#!；等级经验 #P +170#!。"
 kizuna.229.c: "现在还不是时候，先继续积累\n#P 效果：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 创作进度 #P +0#!；等级经验 #P +190#!。"
 kizuna.230.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 校园祭演出"
 kizuna.230.desc: "#bold 触发乐队：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')]\n\n校园祭的负责人向我们发来了演出邀请。台子不算大，但观众会很多，而且氛围天然亲近。"
 kizuna.230.a: "准备最热闹的曲子，把气氛炒起来\n#P 效果：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 创作进度 #P +35#!；等级经验 #P +150#!。"
 kizuna.230.b: "趁这个机会试试新歌\n#P 效果：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 创作进度 #P +20#!；等级经验 #P +170#!。"
 kizuna.230.c: "当作一次轻松的小型练兵\n#P 效果：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 创作进度 #P +0#!；等级经验 #P +180#!。"
 kizuna.231.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 报纸专栏评价"
 kizuna.231.desc: "#bold 触发乐队：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')]\n\n有报纸专栏开始正式谈论这支乐队了。无论褒贬，这都说明我们已经进入了更大的视野。"
 kizuna.231.a: "趁热打铁，把关注转成动力\n#P 效果：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 创作进度 #P +40#!；等级经验 #P +130#!。"
 kizuna.231.b: "冷静读完评论，把能学的都学走\n#P 效果：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 创作进度 #P +20#!；等级经验 #P +190#!。"
 kizuna.231.c: "别被外界声音带偏方向\n#P 效果：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 创作进度 #P +30#!；等级经验 #P +120#!。"
 kizuna.232.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 粉丝自发应援"
 kizuna.232.desc: "#bold 触发乐队：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')]\n\n有人开始自发画应援物、准备标语，还会在演出结束后留下鼓励的话。那些笨拙却认真的支持，让大家都受到了鼓舞。"
 kizuna.232.a: "认真回应她们的热情\n#P 效果：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 创作进度 #P +45#!；等级经验 #P +130#!。"
 kizuna.232.b: "把这份心意变成更好的作品\n#P 效果：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 创作进度 #P +20#!；等级经验 #P +170#!。"
 kizuna.232.c: "保持平常心，别让自己失衡\n#P 效果：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 创作进度 #P +10#!；等级经验 #P +180#!。"
