 kizuna.201.desc: "#bold 触发乐队：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')]\n\n一支乐队已经完成了本轮创作。现在，是时候看看这首新作最终会收获怎样的评价了。"
 kizuna.201.a: "揭晓结果"
 kizuna.202.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 新作大成功"
 kizuna.202.desc: "#bold 触发乐队：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')]\n\n新曲一经问世便大受欢迎。乐队巨大的反响中迅速成长，国家也借此收获了更多文化号召力。\n\n#bold 实际收益：#!该乐队等级经验 #P +2200#!；国家获得 $tot_band_hit_song_modifier$，持续 #v 2年#!。"
 kizuna.202.a: "这都是大家努力的结果！\n#P 效果：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 等级经验 #P +2600#!；国家获得 $tot_band_hit_song_modifier$，持续 #v 2年#!。"
 kizuna.203.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 新作反响一般"
 kizuna.203.desc: "#bold 触发乐队：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')]\n\n这次的新作顺利完成，但反响较为平淡。它没有掀起浪潮，不过仍旧为乐队带来了可贵的积累。\n\n#bold 实际收益：#!该乐队等级经验 #P +800#!。"
 kizuna.203.a: "一点一点的积累就可以创造奇迹\n#P 效果：#![SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 等级经验 #P +1100#!。"
 kizuna.204.t: "[SCOPE.GetRootScope.GetCountry.GetCustom('tot_band_pending_event_band_loc')] 新曲遇到瓶颈"
