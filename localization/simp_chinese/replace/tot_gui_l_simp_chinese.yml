 band_gold_tooltip_1: "乐队预算几乎见底，只能用爱发电进行创作了。\n立刻提高10点创作进度"
 band_gold_tooltip_2: "给乐队拨款少量资金，至少够通勤费用了（难说）\n立刻提高30点创作进度"
 band_gold_tooltip_3: "给乐队拨款中量资金，能给乐器进行保养维护了。\n立刻提高50点创作进度"
 band_gold_tooltip_4: "给乐队拨款可观的资金，供他们的场地，服饰，甚至下午茶等额外开销。\n立刻提高70点创作进度"
 band_gold_tooltip_5: "给乐队拨款大量的资金，无论是乐队的常规需求和乐队的额外需求都能较容易满足，少女们可以全身心投入创作而不是为了预算发愁。\n立刻提高90点创作进度"
 band_gold_tooltip_6: "给乐队拨款巨量的资金，这简直不是高中生过家家乐队会有的条件。倒是像某个富可敌国，自带游艇和别墅的金发富二代组的乐队一样。\n立刻提高110点创作进度"
 band_tools_tooltip: "提供乐器资源，官方的乐器就是便宜又好使。"
 band_paper_tooltip: "提供纸张资源，无论是写铺子还是做海报都得用到纸张。"
 band_luxury_clothes_tooltip: "提供高档服装资源，少女们对华丽的演出服感到满意。"
 band_transportation_tooltip: "提供运力资源，通勤需求初步得到保障。"
 band_automobiles_tooltip: "提供汽车资源，有了汽车就可以快速参加排练和演出。"
 band_radios_tooltip: "提供电子资源，虽说手机不是本时代的产物......"
 band_fruit_tooltip: "提供水果资源，比如草莓...没有少女会讨厌这个"
 band_tea_tooltip: "提供茶资源，真的要像某个乐队到部室就是为了喝茶吗？"
 band_coffee_tooltip: "提供咖啡资源，作为茶的替代品，也深受少女们喜爱。"
 band_groceries_tooltip: "提供合成食品资源，面包或者甜点...下午茶的绝配。"
 band_luxury_drinks_tooltip: "提供高档饮品资源，在咖啡厅里谈论乐队的事情也挺有趣的呢。"
 band_luxury_foodd_tooltip: "提供高档食品资源，谁会在汉堡店讨论乐队啊！"
 
