 TOT_OPEN_BAND_MANAGER: "打开乐队管理"
 TOT_OPEN_BAND_MANAGER_TOOLTIP: "打开乐队管理日志，在其中任命成员、调整职位、命名并管理创作投入。"
 TOT_BAND_BUILDING_PANEL_LABEL: "绑定乐队"
 TOT_BAND_BUILDING_PANEL_TOOLTIP: "建筑页负责这座政府文化总部的乐队路线、投入支持与挂钩对象。这里的核心产出是乐队创作进度修正，并会根据路线偏向附带影响演出、体验与投入消耗；成员任命、岗位调整与创作管理请在乐队日志里完成。"
 TOT_BAND_BUILDING_CREATE_HQ_BAND_HINT: "这个州的乐队总部尚未挂钩乐队。先在这里选择要挂钩的 1-3 号乐队，挂上后再去日志里安排成员。"
 TOT_BAND_BUILDING_BOUND_HINT: "这座总部已经挂钩到上方乐队。下面的生产方式会持续提供乐队创作进度修正，并按所选路线与投入档位影响演出、体验和物资消耗；成员与创作进度请在乐队日志中查看。"
