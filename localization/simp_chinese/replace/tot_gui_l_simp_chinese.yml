 TOT_CHARACTER_GROWTH_EXP_TOOLTIP: "#bold 通用经验#!\n当前：[Character.MakeScope.Var('tot_character_growth_exp').GetValue|0]/[Character.MakeScope.ScriptValue('tot_character_growth_next_cost_text_value')|0]\n每周预计：#P +[Character.MakeScope.ScriptValue('tot_character_growth_weekly_gain_value')|0]#!\n\n#bold 来源#!\n历史角色基础：#P +10#!\n统治者：#P +3#!\n利益集团领袖：#P +3#!\n\n#bold 当前特质成本#!\n基础值：#P [Character.MakeScope.ScriptValue('tot_character_growth_cost_base_value')|0]#!\n乘算修正：#P [Character.MakeScope.ScriptValue('tot_character_growth_cost_mult_value')|=+0]%#!\n加算修正：#P [Character.MakeScope.ScriptValue('tot_character_growth_cost_add_value')|=+0]#!\n已获取特质：#P [Character.MakeScope.ScriptValue('tot_character_growth_acquired_traits_count_value')|0]#! 个\n每个已获取特质额外加算：#P +[Character.MakeScope.ScriptValue('tot_character_growth_cost_per_trait_flat_value')|0]#!\n实时总成本：#P [Character.MakeScope.ScriptValue('tot_character_growth_next_cost_text_value')|0]#!\n\n达到当前门槛后会随机获得一个尚未拥有的职业或特长羁绊，并提高下一次获取成本。当前版本仅历史角色可以获得养成经验与随机羁绊。"
 TOT_CHARACTER_GROWTH_EXP_STAGE_COSTS: "成本：基础1000，乘算 [Character.MakeScope.ScriptValue('tot_character_growth_cost_mult_value')|=+0]%，加算 [Character.MakeScope.ScriptValue('tot_character_growth_cost_add_value')|=+0]，已获取 [Character.MakeScope.ScriptValue('tot_character_growth_acquired_traits_count_value')|0]"
