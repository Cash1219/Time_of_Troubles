 TOT_GOURMET_PROGRESS_TOOLTIP: "#bold 美食家进度#!\n当前进度：[AccessPlayer.MakeScope.Var('tot_gourmet_progress').GetValue|0]/36000\n每周预计增长：#P +[AccessPlayer.MakeScope.ScriptValue('tot_gourmet_weekly_gain_value')|0]#!\n\n#bold 可能来源#!\n美食家基础：每名拥有该特质的本国角色 #P +3#!\n执政加成：君主、继承人、执政利益集团领袖每名使总倍率 #P +3%#!\n持续投入：每种启用的食物或饮料资源会持续追加 #v 50#! 单位需求；在市场供给足够时每周 #P +5#!\n种类加成：从第2种资源起，每多1种额外 #P +3#!\n\n将鼠标悬浮在下方“周增长”说明上，可查看当前已生效来源。"
 TOT_GOURMET_CURRENT_SOURCES_TOOLTIP: "#bold 当前周增长来源#!\n当前总周增长：#P +[AccessPlayer.MakeScope.ScriptValue('tot_gourmet_weekly_gain_value')|0]#!\n\n本国美食家人数：[AccessPlayer.MakeScope.ScriptValue('tot_gourmet_character_count_value')|0]\n基础增长：[AccessPlayer.MakeScope.ScriptValue('tot_gourmet_base_weekly_gain_value')|0]\n执政加成人数：[AccessPlayer.MakeScope.ScriptValue('tot_gourmet_government_character_count_value')|0]\n当前执政倍率：[AccessPlayer.MakeScope.ScriptValue('tot_gourmet_government_multiplier_percent_value')|0]%\n当前投入总量：[AccessPlayer.MakeScope.ScriptValue('tot_gourmet_total_investment_value')|0]\n当前种类数：[AccessPlayer.MakeScope.ScriptValue('tot_gourmet_variety_count_value')|0]\n当前种类加成：[AccessPlayer.MakeScope.ScriptValue('tot_gourmet_variety_bonus_value')|0]"
