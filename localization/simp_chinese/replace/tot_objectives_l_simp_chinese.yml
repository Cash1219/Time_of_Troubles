 objective_tot_idol_empire_legacy: "偶像帝国的遗产"
 objective_tot_idol_empire_legacy_desc: "古代的偶像前辈曾建立辉煌的偶像帝国，以维也纳金色大厅为统治中心，以艺术缔结外交、以比赛裁决纷争。继承权之争与赛事经济的扩张却推动各地分权，帝国终究走向分裂。主家偶像大师继承核心领地，Lovelive承继副核心领地；两家围绕正统之名争执不休，外部势力也开始介入。无论循传统，以外交与竞演重建秩序，还是以武力再造帝国，都将是一场漫长的努力。"
 objective_tot_idol_empire_legacy_idle_header: "继续前行"
 objective_tot_idol_empire_legacy_idle_hint: "金色大厅仍在等待新的主人。"
 objective_tot_idol_empire_legacy_name_GBDP: "#v $GBDP$#!"
 objective_tot_idol_empire_legacy_desc_GBDP: "邦多利的崛起始于乐队商业。长期经营为帝国积累了最初的资本，并一度主导周边的货币流通。大圣战中，邦多利与轻音帝国并肩作战，取得广阔的海外领地与显赫的政治地位，户山香澄亦因此封圣。盛极一时的邦多利随后投身殖民扩张，却因决策失误与环境变迁失去优势。重振本土商业、恢复殖民地交通，将是重建邦多利霸权的首要任务。"
 objective_tot_idol_empire_legacy_name_AFTG: "#v $AFTG$#!"
 objective_tot_idol_empire_legacy_desc_AFTG: "邦多利经由地中海向埃塞俄比亚投射力量后，Afterglow被任命为当地总督团。她们在此开辟种植园、建设咖啡厅，为宗主国输送源源不断的原材料。殖民地的繁荣建立在贸易航线与本土支持之上；如何维持开发、巩固秩序，并在帝国动摇时保障自身利益，将决定Afterglow的未来。"
 objective_tot_idol_empire_legacy_name_HHWO: "#v $HHWO$#!"
 objective_tot_idol_empire_legacy_desc_HHWO: "为实现“将笑容带给世界”的梦想，邦多利首富弦卷心率Hello, Happy World!乘微笑号横渡大洋。抵达北美东海岸后，她以音乐与演出感化当地原住民，并以和平方式建立起新的国度。新国度为本土带来资源与政治影响力，却也长期占用大量资金，成为邦多利财政紧张与衰落的重要诱因。如今，HHW必须在理想、自治与对本土的责任之间作出选择。"
 objective_tot_idol_empire_legacy_name_STLI: "#v $STLI$#!"
 objective_tot_idol_empire_legacy_desc_STLI: "圣翔最初只是一所普通的演艺学校。她们在地中海诸战中提供大量佣兵，“舞台少女”的身份因而获得认可；以决斗式演出裁定胜负的新形式，也逐渐为偶像圈所接受。在邦多利武士道财团的扶持下，圣翔最终独立建国，并以舞台少女之名向周边国家提供军事指导。如何将演出传统、佣兵遗产与国家影响力结合，将决定圣翔能否在动荡的地中海立足。"
 objective_tot_idol_empire_legacy_name_MUS: "#v $MUS$#!"
 objective_tot_idol_empire_legacy_desc_MUS: "Lovelive帝国发迹于外多瑙，全盛时统合多个团体，雄踞东欧，“大Lovelive主义”一度声名远播。并入偶像帝国后，各地长期受制，直至帝国解体才重获空间；但Lovelive自身也随即陷入新的继承危机，附属团体纷纷要求更高自治权。缪斯面前只有两条道路：复兴集权的大Lovelive帝国，或以多民族分权的偶像帝国自居。"
 objective_tot_idol_empire_legacy_name_AQO: "#v $AQO$#!"
 objective_tot_idol_empire_legacy_desc_AQO: "作为Lovelive帝国的附属团体，Aqours长期承担海上贸易与海军整备。偶像帝国解体后，缪斯授予她们更高的自治权；航路、港口与舰队因而成为Aqours手中最重要的筹码。是继续作为Lovelive的海上支柱，还是以海洋贸易为基础争取更大的自主空间，正等待她们作出选择。"
 objective_tot_idol_empire_legacy_name_NJS: "#v $NJS$#!"
 objective_tot_idol_empire_legacy_desc_NJS: "作为Lovelive帝国的附属团体，虹咲长期负责北部边防与内陆交通，维系着东欧腹地的联系。偶像帝国解体后，缪斯授予她们更高的自治权。面对日益分散的旧帝国，虹咲既可继续充当北方屏障，也可凭借枢纽地位塑造属于自己的秩序。"
 objective_tot_idol_empire_legacy_name_IDMS: "#v $IDMS$#!"
 objective_tot_idol_empire_legacy_desc_IDMS: "765事务所早年以偶像经营在南德铺开庞大商网，继而进军巴尔干，建立横跨中东欧的偶像帝国。继承权争端最终撕裂帝国，连昔日的帝国本部也分为两部分。维也纳始终有人希望修复金色大厅、重建帝国；也有人主张接受分权现实，以新的共同体维持秩序。偶像大师必须决定，究竟继承帝国的冠冕，还是改写它的遗产。"
 objective_tot_idol_empire_legacy_name_GKMS: "#v $GKMS$#!"
 objective_tot_idol_empire_legacy_desc_GKMS: "初星学园是偶像大师体系下的分支学园，凭借繁荣的经济与持续的商业影响力，在帝国兴衰中始终占有一席之地。随着旧秩序瓦解，初星既可成为维也纳重建计划的可靠后方，也可将经济实力转化为更独立的政治声音。"
 objective_tot_idol_empire_legacy_name_ROM: "#v $ROM$#!"
 objective_tot_idol_empire_legacy_desc_ROM: "这是一个被多方拼凑而成的国家。轻音入主希腊后，为奖赏追随有功的无刺有刺，便将这片领地整合封赐于她们。然而，顶级偶像星野爱与明星乐队弗兰秀秀始终盘踞当地；邦多利随后又派遣Pastel*Palettes前来争夺影响力。这个临时拼合的国家从未形成有效治理，只能在各方势力的拉扯中勉强维持。歌声或许能够调和人心，却未必足以终结所有争端。"

 objective_tot_italy: "星石、圣座与破碎的权杖"
 objective_tot_italy_desc: "威尼斯的少女乐团派对凭商业贸易、乐队文化与星石货币崛起，又因殖民押注、Crychic债务与BangDream大赛衰落而失去巅峰。圣翔音乐学园、少女乐团派对、佛罗伦萨共和国、教皇国与尼禄的南意大利彼此牵制，北意大利邦联和罗马圣座都想把破碎半岛重新写成自己的乐谱。"
 objective_tot_italy_idle_header: "继续前行"
 objective_tot_italy_idle_hint: "星石仍在流通，乐队时代却已经进入尾声。"
