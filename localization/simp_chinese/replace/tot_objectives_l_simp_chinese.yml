l_simp_chinese:
 objective_tot_updating: "致爱丽丝"
 objective_tot_updating_desc: "献给仍在旅途中的你。这里收录的是第十二版编年史下优先完成的路线与系统：新边疆、新秩序，以及仍在被书写的未来。选择任一国家起步，沿着更新线索推进，即可逐步体验模组当期主打内容。"
 objective_tot_updating_idle_header: "继续前行"
 objective_tot_updating_idle_hint: "风暴尚未停歇，而新的篇章正在被点亮。"

 objective_tot_euro_core: "革命的遗产"
 objective_tot_euro_core_desc: "旧大陆西缘仍由王权、议会与资本三股力量撕扯。英伦试图守住海权金融体系，法兰西寻求重塑大陆话语，而阿尔萨斯则站在边境断层上，既是缓冲带，也是引线。你将决定‘革命遗产’究竟会成为秩序的锚，还是下一场战争的火种。"
 objective_tot_euro_core_idle_header: "继续前行"
 objective_tot_euro_core_idle_hint: "在铁与煤之上，旧誓言正在被重新定价。"

 objective_tot_germany: "德意志诸邦"
 objective_tot_germany_desc: "分裂的德意志世界并不缺少雄心，缺少的是谁来定义‘统一’的代价。普鲁士、莱茵兰与诸公国在工业动员、宗教合法性与军制革新之间角力。你既可以铸造一个纪律严密的中央国家，也可能放任诸邦在竞争中走向另一种秩序。"
 objective_tot_germany_idle_header: "继续前行"
 objective_tot_germany_idle_hint: "每一条铁路都通向前线，每一份税单都指向未来。"

 objective_tot_italy_states: "意大利诸国"
 objective_tot_italy_states_desc: "半岛从来不是一张平整的地图，而是一场持续数百年的谈判。教廷、商港、王国与雇佣军传统交织在一起，使意大利既可能成为地中海的心脏，也可能继续停留在碎片化均势中。你的抉择将决定是‘一个意大利’，还是‘许多个意大利’。"
 objective_tot_italy_states_idle_header: "继续前行"
 objective_tot_italy_states_idle_hint: "钟声与炮声同在，王冠与账本并重。"

 objective_tot_nordic_order: "拨云见日"
 objective_tot_nordic_order_desc: "北方的寒潮带走了旧盟约，也逼出了新的生存法则。后丘比时代的北欧诸国在航运、木材、矿业与防务同盟之间重建秩序。这里没有轻易的霸权，只有在长期博弈中形成的‘共存规则’。你要做的，是把规则写成现实。"
 objective_tot_nordic_order_idle_header: "继续前行"
 objective_tot_nordic_order_idle_hint: "极夜会过去，但谁来定义黎明的边界？"

 objective_tot_bluewhite_fort: "蓝白堡"
 objective_tot_bluewhite_fort_desc: "东线从不是单纯的国境线，而是文明、信仰与安全焦虑叠加出的‘堡垒地带’。拜占庭余绪、草原军政与新式民族国家在此并行。你可以构建防御纵深、整合边疆产业，也可能在长期动员中把均势推向全面对抗。"
 objective_tot_bluewhite_fort_idle_header: "继续前行"
 objective_tot_bluewhite_fort_idle_hint: "边境从不沉默，它只是在等待下一道命令。"

 objective_tot_iberia_nafrica: "地中海戡乱"
 objective_tot_iberia_nafrica_desc: "伊比利亚与北非的战后局势仍在震荡。港口税权、补给航线与殖民遗产彼此纠缠，地方叛乱与中央整编同时发生。你将面对的是一片‘需要被治理’的海，而不是一条‘可以被穿越’的海。戡乱只是起点，重建才是胜负手。"
 objective_tot_iberia_nafrica_idle_header: "继续前行"
 objective_tot_iberia_nafrica_idle_hint: "海风会吹散硝烟，但不会自动带来秩序。"

 objective_tot_rhodes_network: "重新连接"
 objective_tot_rhodes_network_desc: "旧网络已经断裂，但节点从未消失。罗德系势力要做的不是回到过去，而是在断链后的世界里重建航路、商栈、情报与工业协作。你可以把离散据点缝合成新共同体，也可能让它们在竞争中再次分崩离析。"
 objective_tot_rhodes_network_idle_header: "继续前行"
 objective_tot_rhodes_network_idle_hint: "每一次通航，都是对旧世界的一次修补。"

 objective_tot_india_arc: "游戏之神的召唤"
 objective_tot_india_arc_desc: "南亚与叶界线正在汇流，旧王朝、公司势力与新兴军事政体共同争夺‘谁来定义规则’。在这条弧线上，统一并不只意味着扩张，更意味着制度输出、交通整合与财政重建。回应召唤之后，你需要证明自己有能力承受召唤的代价。"
 objective_tot_india_arc_idle_header: "继续前行"
 objective_tot_india_arc_idle_hint: "当神谕降临，真正被考验的始终是人间秩序。"

