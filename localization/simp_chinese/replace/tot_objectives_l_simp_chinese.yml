 BUG_FLAVOR_TEXT: "$BUG$ 在第十二版中被定义为“更新线承压点”：多条新机制、事件链和新势力都会先在这里碰撞。它的国家叙事核心不是扩张，而是先在混乱里证明新制度能活下来，再把样板复制给周边。"
 ALS_FLAVOR_TEXT: "$ALS$ 的背景先于原作梗：它是英法-德意志断层上的前沿缓冲国，长期承受法国革命遗产与德意志统一潮双重压力。原作气质在这里被改写成“夹缝生存”的边境美学，站队本身就是国家命运。"
 PRU_FLAVOR_TEXT: "设定大纲里，$PRU$ 是“魔法少女统一德意志线”的发动机之一，承担对抗丘比势力与推进统一的双任务。高町奈叶、巴麻美路线若受挫，鹿目圆与晓美焰将推动更理想主义的救赎叙事，这才是普鲁士线的核心。"
 GERW_FLAVOR_TEXT: "$GERW$ 在编年史中的定位是德意志协商派中枢，优先通过经济联结与制度整合压制内战烈度。它的原作感不是热血冲锋，而是“理性派主角团”风格：靠体系胜过靠奇迹。"
 RHE_FLAVOR_TEXT: "$RHE$ 的设定背景是莱茵经济走廊与意识形态前线重叠区，既吃到贸易红利，也最先遭到外部渗透。原作角色群像在此被赋予“都市联邦派”色彩，重点是守住繁荣而不被两侧吞并。"
 BAV_FLAVOR_TEXT: "$BAV$ 在大纲里代表南德传统王权与地方军政网络，是德意志南线平衡锚点。原作风格被放在“贵族礼法与现代动员并存”的叙事上，既可守旧，也可转身争夺统一话语权。"
 WUR_FLAVOR_TEXT: "$WUR$ 的历史定位是夹在强邻之间的弹性邦国，常以联姻、协约与转向求生。对应原作味道是“低调却关键”的副主角国，胜负常取决于它在关键战役前夜选择站哪一边。"
 IDMS_FLAVOR_TEXT: "$IDMS$ 在设定中更接近制度实验邦，擅长财政、征兵与行政模板输出。原作气质次之，重点是它像“幕后策士”国家，把别人打下来的地盘变成可长期治理的秩序。"
 MHGK_FLAVOR_TEXT: "$MHGK$ 的编年史背景是旧贵族、军工资本和地方军团混合共治，动员强但内耗也强。原作角色在此呈现“强硬派会不会失控”的命题，国家戏剧张力来自治理而非单纯战争。"
 STLI_FLAVOR_TEXT: "$STLI$ 在意大利大纲里属于北线推进派，承担统一行动的前锋职责，也最容易引发半岛全面升级。原作风格被压到第二层，主旋律是“统一速度与统治成本”的代价博弈。"
 PAP_FLAVOR_TEXT: "$PAP$ 的设定重点是教权现实化：它不仅给合法性，还直接影响南北意大利同盟与战争结构。原作修辞只是外衣，核心仍是教廷如何在工业时代把神圣权威转译为可执行政令。"
 RITA_FLAVOR_TEXT: "$RITA$ 在大纲中的角色是城邦网络与商贸自治势力代表，靠金融和结盟维持主体性。原作气质偏“机敏派”，但本质叙事仍是小国如何在统一洪流中保住制度独立。"
 GBDP_FLAVOR_TEXT: "$GBDP$ 在设定里偏向北意协作组织者，负责把文化号召转成军政执行。原作层面像偶像团体运营国家版，但主轴依旧是后勤、税基与吞并区治理。"
 TUS_FLAVOR_TEXT: "$TUS$ 的编年史锚点很明确：佛罗伦萨崛起、推翻苛政、重建共和国并发展工商业与文化。原作风味只是点缀，核心是“文艺复兴传统在近代国家中的二次复活”。"
 OOAR_FLAVOR_TEXT: "$OOAR$ 的背景是后丘比时代北欧重建，任务是恢复港口、矿业与寒带航运体系。原作叙事在此转为“灾后共同体”笔调，重点不是称霸，而是把北方从战区修回生活区。"
 STRW_FLAVOR_TEXT: "$STRW$ 在设定中的实质价值是海峡控制权，它决定北欧税流、补给和舰队出入节奏。原作味道可理解为“守门人角色”，但国家主线是卡住咽喉就能左右全局。"
 NOR_FLAVOR_TEXT: "$NOR$ 设定上依托海运与沿岸经济复苏，在北欧线承担稳定器和再增长引擎。原作气质偏温和治愈，但编年史要求它最终把民生恢复转化成区域领导力。"
 TBUN_FLAVOR_TEXT: "$TBUN$ 的大纲定位是节点型国家，控制补给与中转，体量小但战略价值高。原作层面像配角，设定层面却是“缺它不转”的机械齿轮。"
 BYZ_FLAVOR_TEXT: "$BYZ$ 在编年史中背负帝国余绪，却必须接受近代财政、军制和工业逻辑。原作史诗感保留，但主叙事是“从神话合法性过渡到制度合法性”的痛苦转型。"
 ROM_FLAVOR_TEXT: "$ROM$ 的设定职责是东线纵深国家：人口、平原、后勤线三位一体，承担长期战争与整编任务。原作风格次之，核心是它能否撑起蓝白堡线的持久战框架。"
 UKR_FLAVOR_TEXT: "$UKR$ 在大纲里是粮仓与前线叠加地带，任何冲突都会在这里被放大成生存问题。原作标签退居其次，设定重心是“被争夺边境”向“自主国家”的转化。"
 MUS_FLAVOR_TEXT: "$MUS$ 的编年史定位是体量巨大的慢变量国家：动员潜力高，但治理链条冗长。原作的强者气场只有在完成制度提效后才成立，这就是它的核心挑战。"
 AQO_FLAVOR_TEXT: "$AQO$ 对应草原机动传统与边境作战文化，在设定里属于高机动战术国家。原作味道是凌厉与果断，但主线仍是补齐工业后骨，避免只会打而不会养。"
 NJS_FLAVOR_TEXT: "$NJS$ 在大纲中是关键节点控制派，强调精锐化而非全面占领。原作气质可写成冷静系主角团，但国家背景核心是用有限资源撬动关键战区。"
 SKD_FLAVOR_TEXT: "$SKD$ 的设定背景直接挂钩伊比利亚危机与斯卡蒂线崩坏后的秩序震荡，是地中海戡乱线最前排国家。原作元素只做风味，主叙事是先止血平叛，再重建海疆治理。"
 GNC_FLAVOR_TEXT: "$GNC$ 在编年史中继承旧航路与地方自治传统，但也因此最易陷入分裂与外部干预。原作感可有可无，核心永远是把自治网络重新纳入国家机器。"
 ADL_FLAVOR_TEXT: "$ADL$ 的背景是典型港市政体：商会、海军与地方派系并存，开放与渗透一体两面。原作气质放在第二位，首要任务是让港口收益服务国家而非派系。"
 EGY_FLAVOR_TEXT: "$EGY$ 在第十二版中连接尼罗考古、蓝晶研究和地中海-内陆交通，是北非重建的中轴国。原作修辞只作为点睛，设定主轴是“谁控物流，谁控重建节奏”。"
 TRI_FLAVOR_TEXT: "$TRI$ 的编年史定位是沙漠边疆韧性国家，擅长在低资源条件下维持作战与据点治理。原作热血感次之，主叙事是从生存型军事体向工业化主权国家跃迁。"
 NRHD_FLAVOR_TEXT: "$NRHD$ 在设定里是断线重连北段枢纽，负责重启停摆航路与北部物流。原作风格可做“灯塔系”意象，但核心是它稳不稳直接决定罗德网络能否重建。"
 ORHD_FLAVOR_TEXT: "$ORHD$ 的背景任务是输出罗德系治理模板，把离散节点统一到同一套医工、财政与后勤标准。原作风味次要，重点是它承担网络国家制度化的主工程。"
 CTCH_FLAVOR_TEXT: "$CTCH$ 在大纲里承担技术与运力核心节点角色，是全网提速器也因此是首要打击目标。原作笔触可偏硬核科技，但设定重点是守住技术中枢。"
 TGCC_FLAVOR_TEXT: "$TGCC$ 的设定定位是跨区协同节点，能把分散胜利转成体系优势。原作上像团队协调者，国家背景上则是罗德网络由点成线的关键拼图。"
 HBPO_FLAVOR_TEXT: "$HBPO$ 在编年史中是后勤稳定锚，负责维持前线补给、工资与医疗循环。原作感可以低调，但设定意义极高：它决定这场长期战争能不能继续打下去。"
 NEP_FLAVOR_TEXT: "$NEP$ 的背景是山地防御与边关自治传统，在印度弧线中主打稳态生存与渐进扩张。原作气质只是包装，设定核心是把地缘防御转成国家财政与工业能力。"
 DAL_FLAVOR_TEXT: "$DAL$ 在大纲里处于多政权交汇带，擅长以贸易与外交维系生存空间。原作风格偏机变，但主叙事是先稳合法性，再争区域话语权。"
 ELZ_FLAVOR_TEXT: "$ELZ$ 的设定关键词是高动员与高风险并存，具备快速改制潜力也容易失控。原作热血线保留，核心仍是把运动式动员沉淀为可继承制度。"
 OVL_FLAVOR_TEXT: "$OVL$ 在编年史中的任务是多族群与多法域整合，属于典型行政难度高、上限也高的整合国。原作风味次之，主线是国家标准化能否压过地方离心。"
 NEWG_FLAVOR_TEXT: "$NEWG$ 被第十二版明确为新秩序实验场，军政、资本与边疆开发同步推进，成败都会外溢到整条印度弧线。原作元素只做点缀，核心是实验模型能否落地复制。"
