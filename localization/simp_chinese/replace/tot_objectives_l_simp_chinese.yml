 objective_tot_northern_europe: "拨云见日"
 objective_tot_northern_europe_desc: "北欧曾是丘比傀儡政权的魔导器工坊，也是罗德岛资产被监视、被迫西迁的地方。大圣战后，挪威镇守府港区、瑞典大洗王国、丹麦北海王国与芬兰继续王国推翻旧枷锁，瑞典更以钢铁雄心重塑校区与军工。北方要证明自己不再是负面情绪的矿场，而是新联邦与新产业的起点。"
 objective_tot_northern_europe_idle_header: "继续前行"
 objective_tot_northern_europe_idle_hint: "丘比的阴云散去后，北海仍需要新的航标。"
