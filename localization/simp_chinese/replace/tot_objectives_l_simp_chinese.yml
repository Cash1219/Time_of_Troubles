 objective_tot_danube: "学园与命运共同体"
 objective_tot_danube_desc: "多瑙不是普通帝国边疆，而是学园文化、偶像政治、舞台竞演与魔法少女制度互相叠加的缓冲带。音乃木阪、舞台少女、偶像大师与南德传统在这里争夺话语权；德意志选帝候制度与魔女审判的余波又让每一次结盟都带着旧债。这里的胜负不只是吞并土地，而是谁能把比赛、信仰和行政真正拧成共同体。"
