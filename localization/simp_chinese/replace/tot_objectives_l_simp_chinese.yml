 je_tot_game_workshop_program: "游戏工坊现代化"
 je_tot_game_workshop_program_desc: "建设并维持一座规模合适、运转良好的游戏工坊，使游戏产业从试作阶段走向稳定经营。"
 je_tot_game_workshop_program_reason: "全国各地的游戏工坊正在从作坊式生产转向更成熟的开发与运营体系。只要形成稳定规模，并让至少一座代表性工坊维持良好运转，就能证明该产业已经真正站稳脚跟。"
 je_tot_goods_workshop_program: "谷子工坊扩张潮"
 je_tot_goods_workshop_program_desc: "扩大谷子工坊的生产规模，建立能够持续盈利并稳定雇佣劳动力的周边产业链。"
 je_tot_goods_workshop_program_reason: "谷子工坊的扩张不只意味着商品种类变多，更意味着从小规模试水转向能够稳定盈利、持续雇佣劳动力的产业链。"

 tot_industry_je.1.t: "游戏产业成形"
 tot_industry_je.1.d: "全国的游戏工坊终于越过了试作与模仿的阶段。成熟的开发流程、稳定的市场需求与持续扩张的玩家群体，正在把这一门新兴产业变成真正的支柱。"
 tot_industry_je.1.f: "从桌面到屏幕，再到更长线的运营体系，游戏已经不再只是消遣，而是一种能够自我繁殖的工业文化。"
 tot_industry_je.1.a: "让创意继续滚动"

 tot_industry_je.2.t: "谷子经济起势"
 tot_industry_je.2.d: "谷子工坊已经不再满足于少量纪念品和应景周边。设计、印刷、加工与销售逐渐连成链条，新的消费热潮开始围绕角色与舞台不断外溢。"
 tot_industry_je.2.f: "当收藏、应援与流行变成稳定生意，周边商品就不再是附属，而会反过来塑造整套文化产业。"
 tot_industry_je.2.a: "把热度变成产业"

