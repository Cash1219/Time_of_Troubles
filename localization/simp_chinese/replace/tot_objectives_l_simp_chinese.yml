 objective_tot_updating: "致爱丽丝"
 objective_tot_updating_desc: "蓝晶本位、尼罗考古与新旧爱丽丝叙事正在把世界推向下一段更新。这里收录当期重点国家：一端是大革命后仍在女皇、共和派与圣女崇拜之间寻找平衡的法兰西，一端是围绕天童爱丽丝与爱丽丝湖兴起的考古共同体。"
