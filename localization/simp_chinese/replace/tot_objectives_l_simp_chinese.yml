 objective_tot_western_europe: "爱丽丝时代的遗产"
 objective_tot_western_europe_desc: "西欧的近代秩序并非单纯由王权与议会塑成。九条可怜的黄金精神、女王爱丽丝的资本主义改革、法国圣女崇拜、伊比利亚的深海余波与低地旅者文化共同定义了这里。蓝晶取代黄金之后，谁能掌握专利、殖民、信仰与航线，谁就能决定爱丽丝时代之后的欧洲。"
 objective_tot_western_europe_idle_header: "继续前行"
 objective_tot_western_europe_idle_hint: "金发贵族、民间女仆、圣女与旅者都在等待新的答案。"
