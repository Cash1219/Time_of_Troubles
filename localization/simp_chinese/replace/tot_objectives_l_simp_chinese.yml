 objective_tot_constantinople: "蓝白堡与下北泽合约"
 objective_tot_constantinople_desc: "秋山澪从樱丘出发，率放课后骑士团与乐队联军占领希腊、罗马尼亚和安纳托利亚，将君士坦丁堡改名为蓝白堡，并以《下北泽合约》终结大圣战。星之鼓动、月咏叹调、结束王国与有刺无刺军团在这里交错，巴尔干不再只是帝国边界，而是学园文化调停世界的试验场。"
 objective_tot_constantinople_idle_header: "继续前行"
 objective_tot_constantinople_idle_hint: "合约可以停战，但不能替任何人完成治理。"
