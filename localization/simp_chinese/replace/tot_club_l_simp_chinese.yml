l_simp_chinese:
 building_club: "社团"
 building_club_lens_option: "扩建$building_club$"

 pmg_club_type: "社团类型"
 pm_club_general: "无主题"
 pm_club_general_desc: "该社团没有固定的活动主题，只维持基础性的日常社交与放课后活动，能略微产出体验，但不会提供额外专项修正。"
 pm_club_literature: "文学部"
 pm_club_literature_desc: "以阅读、写作、研究与资料整理为主要活动内容的文化类社团。"
 pm_club_athletics: "田径部"
 pm_club_athletics_desc: "以体能训练、竞赛活动与纪律协作为主要内容的运动类社团。"
 pm_club_music: "轻音部"
 pm_club_music_desc: "以乐器演奏、合奏练习和小型演出为主要活动内容的音乐类社团。"
 pm_club_drama: "演剧部"
 pm_club_drama_desc: "以剧本排演、舞台表演与集体协作为主要内容的戏剧类社团。"
 pm_club_art: "美术部"
 pm_club_art_desc: "以绘画、设计、装饰制作与审美训练为主要内容的艺术类社团。"

 pmg_club_support: "社团管理方式"
 pm_club_support_illegal: "无合法社团"
 pm_club_support_illegal_desc: "社团虽然存在，但缺乏正式合法身份，只能以低效率与低保障的方式勉强运作。"
 pm_club_support_autonomy: "社团自治"
 pm_club_support_autonomy_desc: "社团主要依靠成员自发组织和自我维持，成本低，扩张快，但缺乏额外制度支持。"
 pm_club_support_advisor: "顾问指导"
 pm_club_support_advisor_desc: "学校为社团配备顾问与基础文书支持，以额外行政与纸张投入换取更稳定的运作。"
 pm_club_support_strict: "严格准入"
 pm_club_support_strict_desc: "只有通过审核并符合标准的社团才能合法稳定活动，数量更少，但单体质量更高。"
 pm_club_support_coordination: "学园统筹"
 pm_club_support_coordination_desc: "社团被纳入学园统一协调与资源配置体系，每一个社团都会反哺国家整体养成。"

 institution_club_management: "社团管理"
 institution_club_management_desc: "通过行政体系协调社团资格、资源分配与活动秩序的学园管理机构。"

 lawgroup_club_management: "社团管理"
 lawgroup_club_management_desc: "国家与学校以何种方式承认、约束并统筹社团活动。"
 law_no_club_management: "无合法社团"
 law_no_club_management_desc: "国家与学校不承认正式社团体系。即使存在类似活动，也缺乏合法身份与稳定支持。"
 law_club_autonomy: "社团自治"
 law_club_autonomy_desc: "社团主要依靠成员自发组织，自主安排活动、招募与运作。制度成本低，数量扩张最容易。"
 law_club_advisor_guidance: "顾问指导"
 law_club_advisor_guidance_desc: "学校允许社团自由发展，但会安排顾问教师提供必要指导，并投入少量文书与行政资源。"
 law_club_strict_admission: "严格准入"
 law_club_strict_admission_desc: "社团成立、活动与成员吸纳都需经过正式审核，数量受到控制，但合格社团会得到更高质量的支持。"
law_club_school_coordination: "学园统筹"
law_club_school_coordination_desc: "社团活动被纳入学园整体治理与资源配置，由学生会与校方统一协调重点方向与组织节奏。每个社团都能反哺整体养成。"

country_tot_club_capacity_add: "社团承载力"
country_tot_club_capacity_add_desc: "国家可稳定维持并转化为有效养成收益的社团活动容量。它通常来自基础值、科技或其他全局加成。"
country_tot_club_capacity_usage_add: "社团承载力占用"
country_tot_club_capacity_usage_add_desc: "当前各类社团活动对国家社团承载力的直接占用。"
country_institution_club_management_max_investment_add: "社团管理机构最大等级"
country_institution_club_management_max_investment_add_desc: "提高社团管理机构可投入的最大等级。"
 
TOT_CLUB_PANEL_SUMMARY: "社团总览"
TOT_CLUB_PANEL_SUMMARY_TOOLTIP: "这里会显示社团制度目前能为国家转化出多少养成收益，以及不同主题社团的覆盖情况。"
TOT_CLUB_PANEL_DESC: "社团建筑本身提供基础体验，而真正能转化为角色养成收益的部分，取决于国家的社团承载力、当前占用与不同主题的覆盖情况。"
TOT_CLUB_PANEL_CORE_VALUES: "当前结算"
TOT_CLUB_PANEL_THEME_VALUES: "主题覆盖"
TOT_CLUB_PANEL_LAW_GUIDE: "法律档位说明"
TOT_CLUB_VALUE_TOTAL: "社团总数"
TOT_CLUB_VALUE_CAP: "社团总承载力"
TOT_CLUB_VALUE_USAGE: "当前承载占用"
TOT_CLUB_VALUE_FREE: "剩余承载力"
TOT_CLUB_VALUE_EFFECTIVE: "计入养成的有效占用"
TOT_CLUB_VALUE_THEME_COUNT: "主题种类数"
TOT_CLUB_VALUE_WEEKLY: "本周社团养成加值"
TOT_CLUB_VALUE_MULT: "经验转化倍率"
 TOT_CLUB_THEME_LITERATURE: "文学部"
 TOT_CLUB_THEME_ATHLETICS: "田径部"
 TOT_CLUB_THEME_MUSIC: "轻音部"
 TOT_CLUB_THEME_DRAMA: "演剧部"
 TOT_CLUB_THEME_ART: "美术部"
TOT_CLUB_LAW_GUIDE_1: "无合法社团：没有正式承载体系，社团无法稳定转化为养成收益。"
TOT_CLUB_LAW_GUIDE_2: "社团自治：承载力最高，但经验转化效率偏低，适合广撒型铺开。"
TOT_CLUB_LAW_GUIDE_3: "顾问指导：承载力适中，效率稳定，适合平衡发展。"
TOT_CLUB_LAW_GUIDE_4: "严格准入：承载力最紧，但单体社团能获得更高训练效率。"
TOT_CLUB_LAW_GUIDE_5: "学园统筹：承载力与效率兼顾，适合集中投入与重点培养。"
TOT_CLUB_PANEL_NOTE: "后续这里还可以继续扩展官方指定营业社团、角色驻点与专项国家修正等内容。"
