TOT_CLUB_PANEL_THEME_VALUES: "主题覆盖"
TOT_CLUB_PANEL_THEME_DESC: "只有本国已经拥有至少一个对应主题社团时，才能点亮该主题。点亮后会额外占用固定社团承载力，并提供一次性的全国修正。"
TOT_CLUB_PANEL_LAW_GUIDE: "法律档位说明"
TOT_CLUB_PANEL_OVERVIEW_DESC: "这一页专门看当前国家社团体系的结算结果。前五项是承载与占用，后四项是主题覆盖、点亮情况与最终经验转化效果。"
TOT_CLUB_PANEL_LAW_DESC: "不同社团法律不是简单高低级，而是偏向不同。前期如果想铺开社团，自治更轻；如果想提高单个社团含金量，严格准入和学园统筹会更适合。"
