l_simp_chinese:
 je_tot_golden_hall_project: "维也纳金色大厅工程"
 je_tot_golden_hall_project_desc: "各方可在本国首都修建临时承建合同，实际占用施工队列与建造力。合同完工后会自动计入金色大厅总进度，并为所属阵营提供同等的偶像帝国继承贡献。"
 je_tot_golden_hall_project_reason: "维也纳金色大厅既是旧偶像帝国的象征，也是各方实力与忠诚的试金石。建设进度只由完成的承建合同推进；阵营在工程中的实际贡献会成为继承结算的重要依据。"
 je_tot_golden_hall_continuation: "维也纳金色大厅续建"
 je_tot_golden_hall_continuation_desc: "继承危机已经结束，但金色大厅尚未竣工。维也纳的当前所有者可以在本国首都继续修建承建合同，直至工程完成。此前各阵营的继承贡献已冻结，不会因续建而改变。"
 je_tot_golden_hall_continuation_reason: "金色大厅的未竟工程随维也纳的归属一并移交。继续建设只决定这座地标何时落成，最终收益永远归维也纳所有者。"
 je_tot_golden_hall_project_status: "#bold 金色大厅工程#!\n总建设进度：[ROOT.GetCountry.MakeScope.Var('tot_golden_hall_progress').GetValue|0]/30\n\n在首都修建#v 小型承建合同#!可推进#v 1#!点进度；修建#v 大型承建合同#!可推进#v 3#!点进度。合同完成后自动结案，不会留下常驻建筑。\n\n危机期间，完成合同会为所属阵营增加等额的继承贡献。危机结束后，只有维也纳所有者可继续建设，且不会改变已经冻结的继承贡献。\n\n工程竣工时，维也纳获得金色大厅地标、#v 5#!级舞台，并显著降低继承危机紧张度。"
 building_tot_golden_hall_small_contract: "金色大厅小型承建合同"
 building_tot_golden_hall_small_contract_desc: "一份在本国首都执行的金色大厅小型承建合同。完工后自动结案，推进维也纳金色大厅建设。"
 building_tot_golden_hall_large_contract: "金色大厅大型承建合同"
 building_tot_golden_hall_large_contract_desc: "一份在本国首都执行的金色大厅大型承建合同。占用更多建造力，完工后推进更多金色大厅建设。"
 building_tot_golden_hall_construction_site: "维也纳金色大厅施工现场"
 building_tot_golden_hall_construction_site_desc: "记录维也纳金色大厅的整体建设进度。"
 je_tot_golden_hall_facade_button: "投资立面与门廊"
 je_tot_golden_hall_facade_button_desc: "直接拨款修缮金色大厅的外立面与门廊。会获得持续3年的短期收益修正，并推进对应工程进度。"
 je_tot_golden_hall_stair_button: "投资前厅与大阶梯"
 je_tot_golden_hall_stair_button_desc: "直接拨款扩建前厅动线与大阶梯。会获得持续3年的短期收益修正，并推进对应工程进度。"
