l_simp_chinese:
 je_tot_golden_hall_project: "维也纳金色大厅工程"
 je_tot_golden_hall_project_desc: "围绕维也纳金色大厅的修缮与扩建，局势内各国都可以持续投入资金与市场资源，争夺声望、分数与文化正统。主体五项全部完工后，维也纳将额外获得舞台等级，并显著缓和继承危机。"
 je_tot_golden_hall_project_reason: "各方正围绕维也纳金色大厅展开长期赞助竞赛。持续投资可为本国换取短期修正、局势分数与文化影响力；若主体工程率先完工，还将显著缓和多瑙局势。"
 je_tot_golden_hall_continuation: "维也纳金色大厅续建"
 je_tot_golden_hall_continuation_desc: "继承危机已经结束，但金色大厅的工程并未彻底完成。如今维也纳的新主人得以继承先前投资，继续把这座大厅修至成型。"
 je_tot_golden_hall_continuation_reason: "继承危机虽已告一段落，但维也纳金色大厅仍未彻底竣工。只要继续投入资金，就能承接旧工程并逐步把大厅修至完全落成。"
 je_tot_golden_hall_project_status: "#bold 金色大厅工程#!\n#title 主体工程#!\n立面与门廊：[ROOT.GetCountry.MakeScope.Var('tot_golden_hall_facade_progress').GetValue|0]/5\n前厅与大阶梯：[ROOT.GetCountry.MakeScope.Var('tot_golden_hall_stair_progress').GetValue|0]/5\n金色主厅：[ROOT.GetCountry.MakeScope.Var('tot_golden_hall_mainhall_progress').GetValue|0]/5\n天花与雕饰：[ROOT.GetCountry.MakeScope.Var('tot_golden_hall_ceiling_progress').GetValue|0]/5\n舞台与管风琴：[ROOT.GetCountry.MakeScope.Var('tot_golden_hall_stage_progress').GetValue|0]/5\n\n#title 现代升级#!\n声学改良：[ROOT.GetCountry.MakeScope.Var('tot_golden_hall_acoustics_progress').GetValue|0]/5\n后台机械：[ROOT.GetCountry.MakeScope.Var('tot_golden_hall_backstage_progress').GetValue|0]/5\n票务与商业廊厅：[ROOT.GetCountry.MakeScope.Var('tot_golden_hall_ticketing_progress').GetValue|0]/5\n贵宾包厢与社交厅：[ROOT.GetCountry.MakeScope.Var('tot_golden_hall_vip_progress').GetValue|0]/5\n城市接待配套：[ROOT.GetCountry.MakeScope.Var('tot_golden_hall_reception_progress').GetValue|0]/5\n\n主体五项全部完工后，维也纳将额外获得#v 5#!级舞台，并大幅降低继承危机紧张度。"
 je_tot_golden_hall_facade_button: "投资立面与门廊"
 je_tot_golden_hall_facade_button_desc: "直接拨款修缮金色大厅的外立面与门廊。会获得持续3年的短期收益修正，并推进对应工程进度。"
 je_tot_golden_hall_stair_button: "投资前厅与大阶梯"
 je_tot_golden_hall_stair_button_desc: "直接拨款扩建前厅动线与大阶梯。会获得持续3年的短期收益修正，并推进对应工程进度。"
 je_tot_golden_hall_mainhall_button: "投资金色主厅"
 je_tot_golden_hall_mainhall_button_desc: "直接拨款整修金色主厅的坐席、包厢与装潢。会获得持续3年的短期收益修正，并推进对应工程进度。"
 je_tot_golden_hall_ceiling_button: "投资天花与雕饰"
 je_tot_golden_hall_ceiling_button_desc: "直接拨款修复穹顶、雕饰与采光结构。会获得持续3年的短期收益修正，并推进对应工程进度。"
 je_tot_golden_hall_stage_button: "投资舞台与管风琴"
 je_tot_golden_hall_stage_button_desc: "直接拨款建设主舞台与管风琴。会获得持续3年的短期收益修正，并推进对应工程进度。主体五项全部完工后，也会在此触发金色大厅落成效果。"
 je_tot_golden_hall_acoustics_button: "投资声学改良"
