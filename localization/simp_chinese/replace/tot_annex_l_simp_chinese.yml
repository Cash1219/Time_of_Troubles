 je_tot_idol_subject_development_status: "这是宗主与属国共同参与的发展竞赛。双方可以完成共同目标；宗主还可以完成宗主目标，属国则有自己的国家目标。任一方先完成5个目标即获胜，竞赛持续10年；宗主获胜后可以进一步降低属国自治，属国获胜则提高自治并获得发展奖励。"
 tot_subject_development_common_1_button: "共同目标：建设艺术基础"
 tot_subject_development_common_1_button_desc: "舞台、乐器工坊和社团的国家总等级均至少为3，并且三类建筑各有至少一座就业率达到75%、资金储备率超过50%、每周盈利为正且未受补贴的建筑。"
 tot_subject_development_common_2_button: "共同目标：扩大经济基础"
 tot_subject_development_common_2_button_desc: "GDP达到500万，平均生活水平达到13。"
 tot_subject_development_common_3_button: "共同目标：发展教育"
 tot_subject_development_common_3_button_desc: "识字率达到40%，并拥有至少2级大学。"
 tot_subject_development_common_4_button: "共同目标：完善国家治理"
 tot_subject_development_common_4_button_desc: "拥有至少4级铁路和3级行政机构。"
 tot_subject_development_common_5_button: "共同目标：完善供应体系"
 tot_subject_development_common_5_button_desc: "拥有至少5级食品厂和3级工具厂。"

 tot_subject_development_overlord_1_button: "宗主目标：稳固宗主关系"
 tot_subject_development_overlord_1_button_desc: "与所有参与竞赛的直属属国关系达到50。"
 tot_subject_development_overlord_2_button: "宗主目标：降低离心倾向"
 tot_subject_development_overlord_2_button_desc: "所有参与竞赛的直属属国独立倾向降至35%或以下。"
 tot_subject_development_overlord_3_button: "宗主目标：扶植属国经济"
 tot_subject_development_overlord_3_button_desc: "所有参与竞赛的直属属国GDP达到150万。"
 tot_subject_development_overlord_4_button: "宗主目标：改善属国民生"
 tot_subject_development_overlord_4_button_desc: "所有参与竞赛的直属属国平均生活水平达到12。"

 tot_subject_development_national_1_button: "国家目标：完成国家项目一"
 tot_subject_development_national_1_button_desc: "完成本国的第一项特化发展目标。不同属国的目标不同。"
 tot_subject_development_national_2_button: "国家目标：完成国家项目二"
 tot_subject_development_national_2_button_desc: "完成本国的第二项特化发展目标。不同属国的目标不同。"
 tot_subject_development_national_3_button: "国家目标：完成国家项目三"
 tot_subject_development_national_3_button_desc: "完成本国的第三项特化发展目标。不同属国的目标不同。"

 tot_subject_development_national_1_AQO_desc: "AQO：拥有至少5级海军基地。"
 tot_subject_development_national_1_NJS_desc: "NJS：拥有至少4级铁路。"
 tot_subject_development_national_1_GKMS_desc: "GKMS：拥有至少3级大学。"
 tot_subject_development_national_1_AVMJ_desc: "AVMJ：拥有至少5级食品厂。"
 tot_subject_development_national_1_MYG_desc: "MYG：拥有至少5级舞台。"
 tot_subject_development_national_1_AFTG_desc: "AFTG：拥有至少10级咖啡种植园。"
 tot_subject_development_national_1_HHWO_desc: "HHWO：拥有至少8级港口。"
 tot_subject_development_national_1_UKR_desc: "UKR：拥有至少15级小麦农场。"
 tot_subject_development_national_1_ROM_desc: "ROM：拥有至少5级舞台。"

 tot_subject_development_national_2_AQO_desc: "AQO：拥有至少3级铁路和5级港口。"
 tot_subject_development_national_2_NJS_desc: "NJS：拥有至少6级铁路和4级行政机构。"
 tot_subject_development_national_2_GKMS_desc: "GKMS：拥有至少5级大学，平均生活水平达到15。"
 tot_subject_development_national_2_AVMJ_desc: "AVMJ：拥有至少3级工具厂和1级发动机厂。"
 tot_subject_development_national_2_MYG_desc: "MYG：拥有至少5级乐器工坊和5级社团。"
 tot_subject_development_national_2_AFTG_desc: "AFTG：拥有至少3级食品厂和10级咖啡种植园。"
 tot_subject_development_national_2_HHWO_desc: "HHWO：拥有至少10级伐木场和8级港口。"
 tot_subject_development_national_2_UKR_desc: "UKR：拥有至少10级小麦农场和5级铁路。"
 tot_subject_development_national_2_ROM_desc: "ROM：拥有至少5级舞台和3级港口。"

 tot_subject_development_national_3_AQO_desc: "AQO：识字率达到40%，平均生活水平达到13。"
 tot_subject_development_national_3_NJS_desc: "NJS：识字率达到45%，GDP达到300万。"
 tot_subject_development_national_3_GKMS_desc: "GKMS：识字率达到60%，平均生活水平达到15。"
 tot_subject_development_national_3_AVMJ_desc: "AVMJ：平均生活水平达到13，GDP达到300万。"
 tot_subject_development_national_3_MYG_desc: "MYG：平均生活水平达到14，识字率达到45%。"
 tot_subject_development_national_3_AFTG_desc: "AFTG：GDP达到300万，平均生活水平达到12。"
 tot_subject_development_national_3_HHWO_desc: "HHWO：识字率达到50%，GDP达到500万。"
 tot_subject_development_national_3_UKR_desc: "UKR：平均生活水平达到12，GDP达到200万。"
 tot_subject_development_national_3_ROM_desc: "ROM：平均生活水平达到13，识字率达到40%。"

 tot_subject_development_overlord_winner_tt: "宗主在发展竞赛中率先完成5个目标。参与属国的自治度降低，宗主获得竞赛胜利奖励。"
 tot_subject_development_subject_winner_tt: "至少一个属国在发展竞赛中率先完成5个目标。该属国获得更高自治度和胜利奖励，其他属国的自治度也会根据竞赛结果调整。"
