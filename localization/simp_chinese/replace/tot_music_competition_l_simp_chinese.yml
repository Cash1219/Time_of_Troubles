 TOT_MUSIC_COMPETITION_REGISTER_SELECTED_BAND_TOOLTIP: "让当前选中的另一支乐队独立参加海选；每个国家最多报名三支乐队。"
 TOT_MUSIC_COMPETITION_SCORE_LABEL: "累计表现积分"
 TOT_MUSIC_COMPETITION_BAND_REPRESENTATIVE: "选择乐队代表"
 TOT_MUSIC_COMPETITION_IDOL_REPRESENTATIVE: "选择偶像个人代表"
 TOT_MUSIC_COMPETITION_IDOL_GROUP_ROSTER: "偶像团体阵容"
 TOT_MUSIC_COMPETITION_IDOL_GROUP_DESCRIPTION: "团体赛自动使用本国全部可用的历史偶像与学园偶像。阵容人数提高团体表现倍率，不占用乐队编制。"
 TOT_MUSIC_COMPETITION_IDOL_GROUP_COUNT: "可用偶像人数："
 TOT_MUSIC_COMPETITION_SELECT_REPRESENTATIVE: "选择"
 TOT_MUSIC_COMPETITION_REFRESH_CANDIDATES: "刷新候选人"
 TOT_MUSIC_COMPETITION_CANCEL: "撤回报名"
 TOT_MUSIC_COMPETITION_REFRESH_FIELD: "刷新当前报名名单"
 TOT_MUSIC_COMPETITION_BRACKET: "国际淘汰赛"
 TOT_MUSIC_COMPETITION_VIEW_FINAL: "决赛"
 TOT_MUSIC_COMPETITION_FORMAT: "赛制：海选积分阶段与淘汰赛阶段。每周基础发挥为8至15分，再乘以项目倍率；乐队倍率来自等级、成员数量与乐器精通，偶像个人赛来自角色等级与偶像特质，偶像团体赛来自可用偶像人数。"
 TOT_MUSIC_COMPETITION_TIMELINE: "报名期一年。报名期结束时若已有至少8支队伍，则关闭报名并进行半年准备；不足8支则继续报名，凑足8支后开始半年准备期。开赛后海选固定持续26周，海选积分前8名自动进入淘汰赛；淘汰赛持续26周。"
 TOT_MUSIC_COMPETITION_REGISTRATION_DEADLINE: "距本届报名截止：#v [GetPlayer.MakeScope.Var('tot_music_competition_registration_days_remaining').GetValue|0]#!天"
