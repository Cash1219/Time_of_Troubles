l_simp_chinese:
 TOT_CHARACTER_TAB_ACTIVITIES: "活动"
 TOT_MUSIC_COMPETITION_TITLE: "维也纳国际音乐大赛"
 TOT_MUSIC_COMPETITION_INTRO: "国际赛事按项目分为个人赛与团体赛。乐队仅参加团体赛；偶像设个人赛和团体赛。海选每周以临场发挥为底分，再按养成倍率结算累计积分，前8名进入决赛。"
 TOT_MUSIC_COMPETITION_BAND: "乐队团体赛"
 TOT_MUSIC_COMPETITION_IDOL_SOLO: "偶像个人赛"
 TOT_MUSIC_COMPETITION_IDOL_GROUP: "偶像团体赛"
 TOT_MUSIC_COMPETITION_ACTING_SOLO: "演艺个人赛"
 TOT_MUSIC_COMPETITION_ACTING_GROUP: "演艺团体赛"
 TOT_MUSIC_COMPETITION_REGISTRATION: "参赛资格与报名"
 TOT_MUSIC_COMPETITION_QUALIFICATION: "参赛资格：乐队须已有合法编制，每国最多报名3支乐队；偶像个人赛须选择一名偶像或学园偶像，团体赛须有至少两名可用偶像。报名满一年且至少8支队伍后关闭报名，再经半年准备期自动开赛。"
 TOT_MUSIC_COMPETITION_NOT_REGISTERED: "尚未报名本届赛事。"
 TOT_MUSIC_COMPETITION_REGISTERED: "已报名本届赛事。"
