l_simp_chinese:
 je_tot_avmj_debt_crisis: "Ave Mujica债务重组"
 je_tot_avmj_debt_crisis_complete_tt: "Ave Mujica的债务本金已经全部偿清。"
 je_tot_avmj_debt_crisis_desc: "Ave Mujica背负着名义本金1,680,000的历史债务。债务本金不会自然消失：国家可以用国库偿还，也可以出售公司份额、投资权与自治权换取偿债资金。外国国家通过原版投资持有 AVMJ 的 GDP 后，可以在对应阶梯上认领经济份额并抵扣债务。"
 je_tot_avmj_debt_crisis_reason: "这不是一次普通的财政赤字，而是丰川家、母鸡卡事务所与旧商业网络共同留下的公司债务。每一个偿债决定都会改变 AVMJ 的经济控制权。"
 je_tot_avmj_debt_crisis_status: "#bold 债务重组状态#!\n剩余本金：#variable [ROOT.GetCountry.MakeScope.Var('tot_avmj_debt_principal').GetValue|0]#!\n已由国库偿还：#variable [ROOT.GetCountry.MakeScope.Var('tot_avmj_debt_repaid').GetValue|0]#!\n由外资 GDP 持有认领：#variable [ROOT.GetCountry.MakeScope.Var('tot_avmj_debt_gdp_repaid').GetValue|0]#!\n\n股权账本：\n国家保留：[ROOT.GetCountry.MakeScope.Var('tot_avmj_state_share').GetValue|0]%\nHTT：[ROOT.GetCountry.MakeScope.Var('tot_avmj_htt_share').GetValue|0]%\nGBDP：[ROOT.GetCountry.MakeScope.Var('tot_avmj_gbdp_share').GetValue|0]%\nMYGO：[ROOT.GetCountry.MakeScope.Var('tot_avmj_mygo_share').GetValue|0]%\n罗德岛：[ROOT.GetCountry.MakeScope.Var('tot_avmj_nrhd_share').GetValue|0]%\n\n最高持股者获得经济控制权，但不会自动改变 AVMJ 的法理宗主。每月按剩余本金的0.35%支付实际利息。"
 je_tot_avmj_repay_50000: "偿还50,000债务"
 je_tot_avmj_repay_50000_desc: "从国库支付50,000，直接减少债务本金。"
 je_tot_avmj_repay_250000: "偿还250,000债务"
 je_tot_avmj_repay_250000_desc: "从国库支付250,000，直接减少债务本金。"
 je_tot_avmj_sell_5_htt: "出售5%份额给 HTT"
 je_tot_avmj_sell_5_htt_desc: "HTT支付84,000取得5%份额。份额从 AVMJ 国家保留份额中转出，并直接计入债务偿还。"
 je_tot_avmj_sell_5_gbdp: "出售5%份额给 GBDP"
 je_tot_avmj_sell_5_gbdp_desc: "GBDP支付84,000取得5%份额。旧商业网络会重新进入 AVMJ 的控制权竞争。"
 je_tot_avmj_sell_5_mygo: "出售5%份额给 MYGO"
 je_tot_avmj_sell_5_mygo_desc: "MYGO支付84,000取得5%份额。MYGO的持股继续增加时，可能提出更激进的整合方案。"
 je_tot_avmj_sell_5_nrhd: "出售5%份额给罗德岛"
 je_tot_avmj_sell_5_nrhd_desc: "罗德岛支付84,000取得5%份额。罗德岛偏向经济投资，不会仅凭持股直接兼并 AVMJ。"
 je_tot_avmj_sell_investment_rights: "出售投资权"
 je_tot_avmj_sell_investment_rights_desc: "以250,000债务减免为代价，签订25年的原版外国投资权条约。HTT、GBDP、MYGO与罗德岛可以直接投资 AVMJ；当外资 GDP 持有达到阶梯后，债务日志会自动认领对应份额。国家保留份额下降10%。"
 je_tot_avmj_sell_autonomy_rights: "出售自治权"
 je_tot_avmj_sell_autonomy_rights_desc: "以400,000债务减免为代价，承认 HTT 对 AVMJ 更深的经济监督，并把10%控制份额计入 HTT。"
 modifier_tot_avmj_debt_burden: "Ave Mujica债务负担"
 modifier_tot_avmj_debt_burden_desc: "高额名义债务正在压缩 AVMJ 的财政、影响力与国际声望。"
 modifier_tot_avmj_control_state: "国家保留经济控制"
 modifier_tot_avmj_control_state_desc: "没有外国股东的持股超过国家保留份额。"
 modifier_tot_avmj_control_htt: "HTT经济控制"
 modifier_tot_avmj_control_htt_desc: "HTT是 AVMJ 的最大股东，并对其经济决策拥有最强影响力。"
 modifier_tot_avmj_control_gbdp: "GBDP经济控制"
 modifier_tot_avmj_control_gbdp_desc: "GBDP重新取得 AVMJ 的最大股东地位，旧商业网络正在回归。"
 modifier_tot_avmj_control_mygo: "MYGO经济控制"
 modifier_tot_avmj_control_mygo_desc: "MYGO成为 AVMJ 的最大股东，祥子旧日关系开始转化为现实的企业控制。"
 modifier_tot_avmj_control_nrhd: "罗德岛经济控制"
 modifier_tot_avmj_control_nrhd_desc: "罗德岛成为 AVMJ 的最大股东，投资网络正在取代直接政治干预。"
