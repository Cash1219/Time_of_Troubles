 je_tot_idol_subject_development_status: "宗主与属国之间一对一的企划发展竞赛。双方均可完成共同目标，并可查看彼此的宗主目标与国家目标；宗主目标仅宗主可完成，国家目标仅属国可完成。任一方率先同时完成5个目标并领先对方即获胜，竞赛持续10年。宗主获胜会降低属国独立倾向并转为低自治的傀儡，属国获胜则转为自治领并获得更高自治；无论胜负，竞赛结束后都解除整合限制，双方都能从竞赛中得到发展与奖励。"

 tot_subject_development_common_1_button: "共同目标：建设艺术基础"
