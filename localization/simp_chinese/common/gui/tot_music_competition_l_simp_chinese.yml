 TOT_MUSIC_COMPETITION_TIMELINE: "报名期一年；若届满时不足8支队伍，则继续开放至凑足8支。达到8支后进入半年准备期，随后海选持续26周，积分前8名自动进入淘汰赛；淘汰赛持续26周。赛后休赛两年，并自动开启下一届报名。"
