 TOT_MUSIC_COMPETITION_REGISTER_SELECTED_BAND_TOOLTIP: "让当前选中的另一支乐队独立参加海选；每个国家最多报名三支乐队。"
 TOT_MUSIC_COMPETITION_SCORE_LABEL: "累计表现积分"
