l_simp_chinese:
#游乐场
 building_amusement_park: "游乐场"
 building_amusement_park_desc: "由市集游艺与庙会摊贩发展而来的综合娱乐场所，以游乐设备为核心，配合场地与商店经营，为城市提供体验产出与休闲去处。"
 building_amusement_park_lens_option: "扩建$building_amusement_park$"

 pmg_amusement_ground: "园区场地"
 pm_amusement_ground_fair: "庙会空地"
 pm_amusement_ground_fair_desc: "从祭典庙会与露天市集发源的空地，帐篷与灯笼拉开游园序幕，适合学园祭与夏日祭。"
 pm_amusement_ground_garden: "游园会场"
 pm_amusement_ground_garden_desc: "围合式的游园会场，旋转木马与花坛点缀其间，是19世纪绅士淑女的约会去处。"
 pm_amusement_ground_electric: "电气乐园"
 pm_amusement_ground_electric_desc: "电气照明点亮园区，霓虹灯与音乐让夜晚的乐园流光溢彩。"
 pm_amusement_ground_dream: "梦幻乐园"
 pm_amusement_ground_dream_desc: "占地广大的综合乐园，主题区与吉祥物云集，是所有人心中的梦想之地。"

 pmg_amusement_ride: "游乐设备"
 pm_amusement_ride_carousel: "旋转木马"
 pm_amusement_ride_carousel_desc: "庙会与游园会的常客，木马的起落是童年与恋爱的共同记忆。"
 pm_amusement_ride_coaster: "蒸汽过山车"
 pm_amusement_ride_coaster_desc: "蒸汽驱动的初代过山车，机械轰鸣与尖叫交织，宣告游乐园进入新纪元。"
 pm_amusement_ride_neon: "霓虹飞车"
 pm_amusement_ride_neon_desc: "电力驱动的霓虹设施，夜空中划出的光轨是约会的高光时刻。"
 pm_amusement_ride_ferris: "摩天轮"
 pm_amusement_ride_ferris_desc: "城市天际线上的巨轮，在最高点俯瞰万家灯火，告白与烟花都从这里开始。"

 pmg_amusement_shop: "园区商店"
 pm_amusement_shop_stall: "祭典屋台"
 pm_amusement_shop_stall_desc: "章鱼烧、苹果糖与捞金鱼沿路排开，祭典的烟火气从这里升起。"
 pm_amusement_shop_souvenir: "纪念品屋"
 pm_amusement_shop_souvenir_desc: "固定的周边与纪念品小屋，让游客把游园的记忆装进口袋。"
 pm_amusement_shop_limited: "主题限定店"
 pm_amusement_shop_limited_desc: "围绕主题角色布置的限定商店，粉丝与收藏者在这里排队结账。"
 pm_amusement_shop_collab: "联动旗舰店"
 pm_amusement_shop_collab_desc: "与IP联动的旗舰店铺，限定周边与应援活动让游乐园成为圣地巡礼的终点。"

#水族馆
 building_aquarium: "水族馆"
 building_aquarium_desc: "面向公众开放的玻璃水箱展馆，以展览为核心，展示海洋与淡水生物，兼顾科普、观光与休闲。"
 building_aquarium_lens_option: "扩建$building_aquarium$"

 pmg_aquarium_ground: "展馆场地"
 pm_aquarium_ground_tank: "玻璃水箱展馆"
 pm_aquarium_ground_tank_desc: "1853年伦敦动物园开放了世界上第一座公共水族馆，玻璃水箱中的水下世界从此向大众敞开。"
 pm_aquarium_ground_marine: "海洋生物馆"
 pm_aquarium_ground_marine_desc: "玻璃工艺的进步让大型海水水箱成为可能，海洋生物的分类与饲养也走向科学化。"
 pm_aquarium_ground_tunnel: "海底隧道"
 pm_aquarium_ground_tunnel_desc: "钢架与玻璃构成的深海隧道让人行走在鱼群之间，成为水族馆约会的经典名场面。"
 pm_aquarium_ground_mega: "巨型综合馆"
 pm_aquarium_ground_mega_desc: "大型综合水族馆以主题展区与吉祥物吸引游客，企鹅、水母与海豚各有自己的应援团。"

 pmg_aquarium_animal_type: "动物类型"
 pm_aquarium_type_freshwater: "淡水生物"
 pm_aquarium_type_freshwater_desc: "淡水鱼与两栖爬行类构成入门展区，谷物与鱼类饲料分别供应草食与肉食种类。"
 pm_aquarium_type_marine: "海水鱼类"
 pm_aquarium_type_marine_desc: "海水循环系统让热带鱼、鲨鱼与鳐鱼入住展馆，肉食鱼类以鱼类饲料为主。"
 pm_aquarium_type_reef: "珊瑚与水母"
 pm_aquarium_type_reef_desc: "珊瑚礁生态与发光水母在灯光下如梦似幻，是拍照与科普的热门展区。"
 pm_aquarium_type_mammal: "海洋哺乳动物"
 pm_aquarium_type_mammal_desc: "海豚与海狮需要更大的水池与更细致的照料，也为未来的动物表演留下了舞台。"

 pmg_aquarium_program: "附加项目"
 pm_aquarium_program_guide: "科普导览"
 pm_aquarium_program_guide_desc: "讲解员带领游客认识展品背后的故事，把科普导览变成水族馆的核心体验。"
 pm_aquarium_program_feeding: "喂食与触摸体验"
 pm_aquarium_program_feeding_desc: "在工作人员指导下投喂与触摸水生生物，谷物与鱼类饲料分区供应，近距离互动让参观更有温度。"
 pm_aquarium_program_night: "夜间项目"
 pm_aquarium_program_night_desc: "夜间水族馆在幽蓝灯光下开放，安静的展示与夜宿活动是另一种浪漫。"
 pm_aquarium_program_concert: "水下音乐会"
 pm_aquarium_program_concert_desc: "在水族馆内举办水下音乐会，音乐、灯光与游动的鱼群共同构成梦幻演出。"

#动物园
 building_zoo: "动物园"
 building_zoo_desc: "饲养并展示多种动物的公共设施，以动物类型与互动表演为核心，是城市重要的休闲场所。"
 building_zoo_lens_option: "扩建$building_zoo$"

 pmg_zoo_ground: "园区场地"
 pm_zoo_ground_pen: "小型围场"
 pm_zoo_ground_pen_desc: "1828年伦敦动物园成立，现代动物园由此诞生；简单的围栏与笼舍是它的起点。"
 pm_zoo_ground_park: "围场园区"
 pm_zoo_ground_park_desc: "规整的围场与步道让游客可以按路线参观，动物的生活空间也更舒适。"
 pm_zoo_ground_stadium: "大型剧场"
 pm_zoo_ground_stadium_desc: "大型动物剧场与猛兽表演场馆，让动物园的表演走向规模化与专业化。"
 pm_zoo_ground_eco: "生态园区"
 pm_zoo_ground_eco_desc: "开放式生态园区模拟动物栖息地，让动物在更自然的环境中生活与展示。"

 pmg_zoo_animal_type: "动物类型"
 pm_zoo_type_small: "小型动物"
 pm_zoo_type_small_desc: "水獭、企鹅与狐猴等小动物展区总是聚集最多人气，是动物园的门面。"
 pm_zoo_type_predator: "猛兽"
 pm_zoo_type_predator_desc: "狮、虎与熊等猛兽展区需要更严格的围栏与饲养管理，也最能吸引游客。"
 pm_zoo_type_large: "大型动物"
 pm_zoo_type_large_desc: "象、犀牛与长颈鹿等大型动物食量惊人，草食与肉食饲料的分区供应是日常。"
 pm_zoo_type_star: "明星动物"
 pm_zoo_type_star_desc: "明星动物成为全城话题，熊猫、羊驼与企鹅的散步活动让游客挤满园区。"

 pmg_zoo_interaction: "动物互动"
 pm_zoo_interaction_basic: "基础互动"
 pm_zoo_interaction_basic_desc: "触摸区与观赏讲解让游客近距离认识动物，是互动体验的起点。"
 pm_zoo_interaction_feeding: "喂食体验"
 pm_zoo_interaction_feeding_desc: "在饲养员指导下亲手投喂，谷物与肉类饲料按草食、肉食分区供应。"
 pm_zoo_interaction_show: "互动表演"
 pm_zoo_interaction_show_desc: "配合饲养员指令的动物表演兼具趣味与训练展示，是园区的高光时刻。"
 pm_zoo_interaction_grand: "大型表演"
 pm_zoo_interaction_grand_desc: "结合灯光与舞台效果的大型动物演出，让动物园之夜同样精彩。"
