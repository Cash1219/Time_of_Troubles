l_simp_chinese:
 law_student_council_system: "学生会体制"
 law_student_council_system_desc: "国家政务以学生会与会长体系为核心运转，强调校内代表性、统筹能力与舞台治理。"
 law_disciplinary_committee: "风纪委员会"
 law_disciplinary_committee_desc: "校园与舞台秩序主要由风纪委员会维护，其职责涵盖活动管理、日常巡查与纪律执行。"
 law_student_executive_cadres: "学生干部制"
 law_student_executive_cadres_desc: "国家行政以学生干部、执行委员与校内治理骨干为主体，重视组织能力、资历与校内声望。"
 lawgroup_magic_control: "法术垄断"
 lawgroup_magic_control_desc: "国家或大众默认对法术知识传播的限制"
 law_familycontrol_rights: "血统至上"
 law_familycontrol_rights_desc: "魔法知识只会在贵族家庭中流传，仅有少量的师徒传承，大众难以接触到魔法"
 familycontrol_rights_tt: "魔法职业将难以在贵族之外的人群中产生，国家的魔法工业建筑可能会受到严重影响"
 law_godbless_rights: "法权神授"
 law_godbless_rights_desc: "魔法的知识被认为是神灵赐予，一切解释权归于教皇。"
 godbless_rights_tt: "魔法职业更容易在教士中产生，且异信者无法学习魔法"
 law_moneycontrol_rights: "资本垄断"
 law_moneycontrol_rights_desc: "魔法知识被财阀垄断，富人对魔法知识予取予夺"
 moneycontrol_rights_tt: "财富将对魔法职业的产生起到决定性作用"
 law_press_education: "魔法知识普及"
 law_press_education_desc: "魔法知识在推动下于国家内广泛传播，就算是最贫穷的人也有机会成为施法者"
 law_press_education_tt: "只要识字，便有机会成为法师。"
